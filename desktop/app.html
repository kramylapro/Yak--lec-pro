<script>
/* Yak-élec-pro – écran « Quantitatif et coffret » */
(function (g) {
  'use strict';
  const EE = g.EE, esc = EE.esc, Q = EE.Quant;
  const ui = () => EE.app.ui, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const key = () => 'eep.quant.' + EE.Store.Users.current().id;
  const Studies = {
    list() { return EE.Store.raw.get(key(), []); },
    save(l) { EE.Store.raw.set(key(), l); },
    get(id) { return Studies.list().find((s) => s.id === id); },
    put(s) { const l = Studies.list(), i = l.findIndex((x) => x.id === s.id); s.modified = Date.now(); if (i < 0) l.push(s); else l[i] = s; Studies.save(l); },
    remove(id) { Studies.save(Studies.list().filter((s) => s.id !== id)); },
  };
  EE.QuantStudies = Studies;
  let cur = null, timer = null;

  // Dessin réaliste d'un appareil modulaire (vue de face) ; remplacé par la photo du catalogue si elle existe
  function deviceArt(d, x, y, w, h, img) {
    const cx = x + w / 2, rating = String(d.sub).split(' ')[0];
    if (img) return `<g class="dev-art photo" data-cid="${esc(d.cid || '')}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#fff" stroke="#888"/><image href="${img}" x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${h - 2}" preserveAspectRatio="xMidYMid meet"/></g>`;
    const body = d.k === 'main' ? '#e9e6e0' : d.k === 'surge' ? '#e4e2f0' : '#f3f1ec';
    let o = `<g class="dev-art" data-cid="${esc(d.cid || '')}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${body}" stroke="#7d7d7d" stroke-width="1.2"/>`;
    // borniers haut et bas avec vis
    [[y, 0], [y + h - 14, 1]].forEach(([yy]) => { o += `<rect x="${x + 2}" y="${yy + 1}" width="${w - 4}" height="12" rx="2" fill="#c9c9c9" stroke="#999" stroke-width=".8"/>`; const n = Math.max(1, Math.round(w / 28)); for (let i = 0; i < n; i++) { const sx = x + (w / n) * (i + .5); o += `<circle cx="${sx}" cy="${yy + 7}" r="3.6" fill="#8a8a8a" stroke="#555" stroke-width=".6"/><line x1="${sx - 2.4}" y1="${yy + 7}" x2="${sx + 2.4}" y2="${yy + 7}" stroke="#333" stroke-width="1"/>`; } });
    if (d.k === 'surge') {
      o += `<rect x="${x + 6}" y="${y + 26}" width="${w - 12}" height="22" rx="3" fill="#2e7d32" stroke="#555"/><text x="${cx}" y="${y + 41}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">OK</text>`;
      o += `<rect x="${x + 6}" y="${y + 54}" width="${w - 12}" height="30" rx="2" fill="#fff" stroke="#aaa"/><text x="${cx}" y="${y + 66}" text-anchor="middle" font-size="9" font-weight="700">PARAFOUDRE</text><text x="${cx}" y="${y + 78}" text-anchor="middle" font-size="8">Type 2</text>`;
    } else {
      // manette (levier) en position enclenchée
      const lw = Math.min(w - 12, 22), lx = cx - lw / 2;
      o += `<rect x="${x + 5}" y="${y + 22}" width="${w - 10}" height="40" rx="3" fill="#cfcfcf" stroke="#999" stroke-width=".8"/><rect x="${lx}" y="${y + 25}" width="${lw}" height="20" rx="3" fill="${d.k === 'main' ? '#c62828' : '#1f1f1f'}" stroke="#000" stroke-width=".8"/><rect x="${lx + 3}" y="${y + 28}" width="${lw - 6}" height="3" rx="1" fill="#fff" opacity=".35"/><text x="${cx}" y="${y + 56}" text-anchor="middle" font-size="8" font-weight="700" fill="#222">I</text>`;
      if (d.k === 'diff') o += `<rect x="${x + 5}" y="${y + 66}" width="${Math.min(w - 10, 26)}" height="11" rx="2" fill="#f2c200" stroke="#7a6200" stroke-width=".8"/><text x="${x + 5 + Math.min(w - 10, 26) / 2}" y="${y + 75}" text-anchor="middle" font-size="8" font-weight="700" fill="#222">T</text>`;
      // étiquette : calibre / sensibilité
      const ly = y + (d.k === 'diff' ? 80 : 68), lh = h - 14 - ly + y - 3;
      o += `<rect x="${x + 5}" y="${ly}" width="${w - 10}" height="${lh}" rx="2" fill="#fff" stroke="#bbb" stroke-width=".8"/>`;
      if (d.k === 'cb') o += `<text x="${cx}" y="${ly + lh / 2 + 1}" text-anchor="middle" font-size="${w < 40 ? 10 : 12}" font-weight="800" fill="#111">C${rating}</text><text x="${cx}" y="${ly + lh / 2 + 11}" text-anchor="middle" font-size="6.5" fill="#333">6000</text>`;
      else if (d.k === 'diff') o += `<text x="${cx}" y="${ly + 11}" text-anchor="middle" font-size="9" font-weight="800" fill="#111">${rating} A</text><text x="${cx}" y="${ly + 21}" text-anchor="middle" font-size="8" font-weight="700" fill="#111">${d.sens || 30}mA</text><text x="${cx}" y="${ly + 31}" text-anchor="middle" font-size="8" fill="#111">${d.typeA ? 'A' : 'AC'}</text>`;
      else o += `<text x="${cx}" y="${ly + lh / 2 + 4}" text-anchor="middle" font-size="10" font-weight="800" fill="#111">${rating} A</text>`;
    }
    return o + '</g>';
  }
  function coffretSVG(cf) {
    const cat = {}; EE.Config.get().catalog.forEach((c) => (cat[c.id] = c));
    const mw = 28, dh = 132, rh = dh + 34, pad = 14, W = cf.perRow * mw + pad * 2, H = cf.nRows * (rh + 8) + pad * 2;
    let o = `<svg class="cofsvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Composition du coffret"><rect x="2" y="2" width="${W - 4}" height="${H - 4}" rx="10" fill="#f7f7f5" stroke="#555" stroke-width="2.5"/>`;
    cf.rows.forEach((r, ri) => {
      const y = pad + ri * (rh + 8) + 8, ry = y + dh / 2 - 6;
      o += `<rect x="${pad - 4}" y="${ry}" width="${cf.perRow * mw + 8}" height="12" fill="#b9bcc0" stroke="#7b7e82"/>`;                      // rail DIN
      for (let m = r.u; m < cf.perRow; m++) o += `<rect x="${pad + m * mw + 1}" y="${y}" width="${mw - 2}" height="${dh}" rx="3" fill="#eceae4" stroke="#c4c1b8" stroke-dasharray="3 3"/>`;
      r.d.forEach((d) => { const x = pad + d.x * mw + 1, w = d.mods * mw - 2; o += deviceArt(d, x, y, w, dh, d.cid && cat[d.cid] && cat[d.cid].img); o += `<text x="${x + w / 2}" y="${y + dh + 14}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${esc(d.label)}</text>`; });
      o += `<text x="${pad}" y="${y - 2}" font-size="9" fill="#666">Rangée ${ri + 1}</text>`;
    });
    return o + '</svg>';
  }

  function resultHTML(study, res) {
    const cfg = EE.Config.get(), M = EE.Config.money, s = res.summary;
    const unpriced = res.items.filter((i) => !i.price).length;
    let h = `<div class="qsum"><span><b>${res.rooms.length}</b> pièce(s)</span><span><b>${s.lights}</b> points lumineux</span><span><b>${s.sockets}</b> prises</span><span><b>${s.circuits}</b> circuits</span><span><b>${res.coffret ? esc(res.coffret.name) : '—'}</b></span></div>`;
    if (res.warns.length) h += `<div class="warn">${res.warns.map((w) => '⚠ ' + esc(w)).join('<br>')}</div>`;
    if (!res.circuits.length) return h + '<p class="muted">Ajoutez des points lumineux, des prises ou des appareils pour obtenir le matériel.</p>';
    h += `<h2 id="qmat">Liste du matériel</h2>`;
    if (unpriced) h += `<p class="muted small no-print">${unpriced} article(s) sans prix : renseignez les prix dans le <b>Portail administrateur › Catalogue</b> pour obtenir le total.</p>`;
    h += `<div class="qwrap"><table class="qt"><thead><tr><th></th><th>Désignation</th><th class="r">Qté</th><th>Unité</th><th class="r">Prix unitaire</th><th class="r">Total</th></tr></thead><tbody>`;
    let lastCat = ''; const symOf = {}; cfg.catalog.forEach((c) => { if (c.sym) symOf[c.id] = c.sym; });
    res.items.forEach((i) => { if (i.cat !== lastCat) { h += `<tr class="cat"><td colspan="6">${esc(i.cat)}</td></tr>`; lastCat = i.cat; } h += `<tr><td class="symcell">${(symOf[i.id] && EE.app.ui.symbol(symOf[i.id], 34)) || ''}</td><td>${esc(i.name)}${i.norm ? `<br><small class="muted">${esc(i.norm)}</small>` : ''}</td><td class="r"><b>${i.qty}</b></td><td>${esc(i.unit)}</td><td class="r">${i.price ? M(i.price) : '—'}</td><td class="r">${i.price ? M(i.total) : '—'}</td></tr>`; });
    h += `</tbody><tfoot><tr><td colspan="5">Matériel</td><td class="r">${M(res.totals.material)}</td></tr>${res.totals.labour ? `<tr><td colspan="5">Main-d'œuvre (${cfg.rules.labourPct} %)</td><td class="r">${M(res.totals.labour)}</td></tr>` : ''}${res.totals.contingency ? `<tr><td colspan="5">Imprévus (${cfg.rules.contingencyPct} %)</td><td class="r">${M(res.totals.contingency)}</td></tr>` : ''}<tr class="tot"><td colspan="5">TOTAL</td><td class="r">${M(res.totals.total)}</td></tr></tfoot></table></div>`;
    h += `<h2 id="qcir">Circuits et protections</h2><div class="qwrap"><table class="qt"><thead><tr><th>Circuit</th><th>Désignation</th><th class="r">Disjoncteur</th><th class="r">Section</th><th class="r">Points</th><th>Différentiel</th><th>Pièces</th></tr></thead><tbody>${res.circuits.map((c) => `<tr><td><b>${c.id}</b></td><td>${esc(c.label)}</td><td class="r">${c.breaker} A</td><td class="r">${String(c.section).replace('.', ',')} mm²</td><td class="r">${c.points}</td><td>${esc(c.diff || '')}</td><td>${esc(c.where)}</td></tr>`).join('')}</tbody></table></div>`;
    h += `<p class="small muted">Courant total des disjoncteurs × coefficient de foisonnement ${cfg.rules.diversity} = <b>${res.totalCurrent.toFixed(1)} A</b> → disjoncteur général proposé : <b>${res.mainA} A</b> (à confirmer par un calcul de puissance).</p>`;
    const norms = [...new Set(res.items.filter((i) => ['Protection', 'Coffret'].includes(i.cat) && i.norm).map((i) => i.norm))];
    if (res.coffret) { const c = res.coffret; h += `<h2 id="qcof">Composition du coffret</h2><p><b>${esc(c.name)}</b> – ${c.used} module(s) utilisé(s) sur ${c.nRows * c.perRow} ; ${c.free} libre(s) (réserve ${c.reservePct} %).</p>${coffretSVG(c)}<p class="small muted">Représentation de face des appareils sur rail DIN (levier rouge : disjoncteur général ; bouton jaune « T » : test du différentiel ; pointillés : places libres). Chaque rangée est alimentée par un peigne ; les places libres reçoivent des obturateurs. Vous pouvez remplacer ces dessins par les photos de vos appareils dans Portail › Catalogue.</p>${norms.length ? `<p class="small"><b>Normes européennes :</b> ${norms.map(esc).join(' · ')}</p>` : ''}`; }
    h += `<p class="small muted">Estimation de métré à partir des dimensions saisies, des règles de calcul et des prix du catalogue (modifiables dans le Portail). Elle ne remplace ni l'étude détaillée ni la vérification par un professionnel qualifié.</p>`;
    return h;
  }

  function renderQuant() {
    const A = EE.app, u = EE.Store.Users.current(); let list = Studies.list();
    if (!list.length) { const s = Q.newStudy('Étude 1'); Studies.put(s); list = [s]; }
    if (!cur || !Studies.get(cur)) cur = list[0].id;
    const st = Studies.get(cur), cfg = EE.Config.get();
    $('#main').innerHTML = `<div class="page"><div class="bar no-print"><h1>Quantitatif et coffret</h1><div class="grow"></div>
        <select id="qsel" aria-label="Étude">${list.map((s) => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <button class="btn" id="qnew">Nouvelle</button><button class="btn" id="qren">Renommer</button><button class="btn" id="qdup">Dupliquer</button><button class="btn danger" id="qdel">Supprimer</button></div>
      <p class="muted no-print">Saisissez les dimensions des pièces et les appareils à installer : l'application calcule les câbles, conduits, appareillage, protections et la composition du coffret. Les règles et les prix se règlent dans le Portail.</p>
      <div class="printonly phead"><b>${esc(cfg.brand.company)}</b><br>${esc(cfg.brand.contact)}<br>Étude : <b>${esc(st.name)}</b> – ${EE.fmtDate(Date.now())}</div>
      <section class="card flat no-print"><h2>1. Pièces</h2><div class="qwrap"><table class="qt in"><thead><tr><th>Pièce</th><th>Long. (m)</th><th>Larg. (m)</th><th>Haut. (m)</th><th title="Distance entre le coffret et la pièce">Dist. coffret (m)</th><th>Points lumineux</th><th>Interr. simples</th><th>Va-et-vient (circuits)</th><th>Prises 16 A</th><th></th></tr></thead><tbody id="qrooms"></tbody></table></div>
        <button class="btn" id="qaddr">＋ Ajouter une pièce</button></section>
      <section class="card flat no-print"><h2>2. Appareils spécialisés</h2><div id="qapps"></div><button class="btn" id="qadda">＋ Ajouter un appareil</button><p class="small muted">Chaque appareil reçoit son propre circuit (calibre et section réglés dans le Portail).</p></section>
      <div class="btnrow no-print"><button class="btn primary" id="qcsv">Exporter en CSV (Excel)</button><button class="btn" id="qprint">Imprimer / enregistrer en PDF</button></div>
      <div id="qres" class="qres"></div></div>`;
    const rooms = $('#qrooms'), apps = $('#qapps');
    const num = (k, v, w = 70, step = 'any') => `<input data-k="${k}" type="number" min="0" step="${step}" value="${esc(v)}" style="width:${w}px" inputmode="decimal">`;
    const drawRooms = () => { rooms.innerHTML = st.rooms.map((r, i) => `<tr data-i="${i}"><td><input data-k="name" value="${esc(r.name)}" style="width:130px"></td><td>${num('L', r.L)}</td><td>${num('W', r.W)}</td><td>${num('H', r.H)}</td><td>${num('dist', r.dist)}</td><td>${num('lights', r.lights, 60, 1)}</td><td>${num('switches', r.switches, 60, 1)}</td><td>${num('vav', r.vav, 60, 1)}</td><td>${num('sockets', r.sockets, 60, 1)}</td><td><button class="btn small danger" data-del="${i}" aria-label="Supprimer la pièce">✕</button></td></tr>`).join(''); };
    const drawApps = () => {
      apps.innerHTML = st.appliances.length ? st.appliances.map((a, i) => `<div class="qapp" data-i="${i}"><select data-k="type">${cfg.specials.map((s) => `<option value="${s.id}"${s.id === a.type ? ' selected' : ''}>${esc(s.name)} (${s.breaker} A / ${String(s.section).replace('.', ',')} mm²)</option>`).join('')}</select>
        <select data-k="room">${st.rooms.map((r) => `<option value="${r.id}"${r.id === a.room ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select>${num('qty', a.qty, 60, 1)}<button class="btn small danger" data-adel="${i}" aria-label="Supprimer l'appareil">✕</button></div>`).join('') : '<p class="muted small">Aucun appareil spécialisé.</p>';
    };
    const recompute = () => { const res = Q.compute(st, EE.Config.get()); EE.lastQuant = { study: st, res }; $('#qres').innerHTML = resultHTML(st, res); };
    const saveSoon = () => { clearTimeout(timer); timer = setTimeout(() => { Studies.put(st); }, 200); recompute(); };
    drawRooms(); drawApps(); recompute();
    rooms.oninput = (e) => { const tr = e.target.closest('tr'); if (!tr || !e.target.dataset.k) return; const r = st.rooms[+tr.dataset.i]; r[e.target.dataset.k] = e.target.dataset.k === 'name' ? e.target.value : e.target.value; saveSoon(); };
    rooms.onclick = (e) => { const b = e.target.closest('[data-del]'); if (!b) return; const r = st.rooms[+b.dataset.del]; st.rooms.splice(+b.dataset.del, 1); st.appliances = st.appliances.filter((a) => a.room !== r.id); drawRooms(); drawApps(); Studies.put(st); recompute(); };
    $('#qaddr').onclick = () => { st.rooms.push(Q.newRoom('Pièce ' + (st.rooms.length + 1))); drawRooms(); drawApps(); Studies.put(st); recompute(); };
    apps.oninput = apps.onchange = (e) => { const d = e.target.closest('.qapp'); if (!d || !e.target.dataset.k) return; st.appliances[+d.dataset.i][e.target.dataset.k] = e.target.value; saveSoon(); };
    apps.onclick = (e) => { const b = e.target.closest('[data-adel]'); if (!b) return; st.appliances.splice(+b.dataset.adel, 1); drawApps(); Studies.put(st); recompute(); };
    $('#qadda').onclick = () => { if (!st.rooms.length) return ui().toast('Ajoutez d\'abord une pièce.', 'bad'); st.appliances.push({ type: cfg.specials[0] && cfg.specials[0].id, room: st.rooms[0].id, qty: 1 }); drawApps(); Studies.put(st); recompute(); };
    $('#qsel').onchange = (e) => { cur = e.target.value; renderQuant(); };
    $('#qnew').onclick = async () => { const n = await nameBox('Nouvelle étude', ''); if (!n) return; const s = Q.newStudy(n); Studies.put(s); cur = s.id; renderQuant(); };
    $('#qren').onclick = async () => { const n = await nameBox('Renommer l\'étude', st.name); if (!n) return; st.name = n; Studies.put(st); renderQuant(); };
    $('#qdup').onclick = () => { const c = EE.clone(st); c.id = EE.uid('q'); c.name = st.name + ' (copie)'; c.created = Date.now(); Studies.put(c); cur = c.id; renderQuant(); };
    $('#qdel').onclick = async () => { if (await ui().confirmBox('Supprimer l\'étude', `Supprimer « <b>${esc(st.name)}</b> » ?`, 'Supprimer')) { Studies.remove(st.id); cur = null; renderQuant(); } };
    $('#qcsv').onclick = () => { const res = Q.compute(st, EE.Config.get()); EE.Export.download('Quantitatif_' + EE.Export.safe(st.name) + '.csv', new Blob([Q.toCSV(st, res)], { type: 'text/csv;charset=utf-8' })); ui().toast('Fichier CSV prêt', 'ok'); };
    $('#qprint').onclick = () => g.print();
  }
  async function nameBox(title, val) {
    return ui().modal({ title, body: `<label>Nom de l'étude<input id="qn" value="${esc(val)}" maxlength="60"></label>`, buttons: [{ label: 'Annuler', value: null }, { label: 'Valider', cls: 'primary', value: () => ($('#qn').value.trim() || null) }] });
  }
  EE.Screens = EE.Screens || {}; EE.Screens.quant = renderQuant;
})(window);

</script>
<script>
/* Yak-élec-pro – écran « Photovoltaïque » : grille de saisie, dimensionnement automatique, synoptique, matériel */
(function (g) {
  'use strict';
  const EE = g.EE, esc = EE.esc, PV = EE.PV;
  const ui = () => EE.app.ui, $ = (s, r = document) => r.querySelector(s);
  const key = () => 'eep.pv.' + EE.Store.Users.current().id;
  const Studies = { list() { return EE.Store.raw.get(key(), []); }, save(l) { EE.Store.raw.set(key(), l); }, get(id) { return Studies.list().find((s) => s.id === id); },
    put(s) { const l = Studies.list(), i = l.findIndex((x) => x.id === s.id); s.modified = Date.now(); if (i < 0) l.push(s); else l[i] = s; Studies.save(l); }, remove(id) { Studies.save(Studies.list().filter((s) => s.id !== id)); } };
  EE.PVStudies = Studies;
  let cur = null, timer = null;
  const f1 = (v) => (typeof v === 'number' ? String(Math.round(v * 10) / 10).replace('.', ',') : esc(v));

  function synoptic(res) {
    const d = res.design; if (!d) return '';
    const iso = d.kind === 'isole', cs = (s) => (s ? s.toString().replace('.', ',') + ' mm²' : '');
    const B = iso ? [
      ['Panneaux', `${d.panelsN} × ${res.panel.W} Wc`, `${d.np} chaîne(s) de ${d.ns}`, '#ffc83d'], ['Protection DC', 'Sectionneur DC', 'Parafoudre DC', '#e0e6ee'],
      ['Régulateur MPPT', `${d.nr} × ${d.mppt.Iout} A`, `${d.vbat} V`, '#bcd6ff'], ['Batteries', `${d.battery.cnt} éléments`, `${d.vbat} V / ${d.battery.p * d.battery.b.Ah} Ah`, '#c9eccb'],
      [d.hybrid ? 'Onduleur hybride' : 'Onduleur', d.inverter ? `${d.ninv} × ${d.inverter.Pcont} W` : '—', d.hybrid ? 'MPPT + chargeur intégrés' : 'pur sinus', '#bcd6ff'], ['Tableau AC', d.acBreaker ? `Disj. ${d.acBreaker} A + ID 30 mA` : '', '230 V', '#e0e6ee']]
      : [['Panneaux', `${d.panelsN} × ${res.panel.W} Wc`, `${d.np} chaîne(s) de ${d.ns}`, '#ffc83d'], ['Protection DC', 'Sectionneur DC', 'Parafoudre DC', '#e0e6ee'], ['Onduleur réseau', `${d.inverter.Pac / 1000} kW`, 'MPPT intégré', '#bcd6ff'], ['Tableau AC', d.acBreaker ? `Disj. ${d.acBreaker} A + ID 30 mA` : '', '230 V', '#e0e6ee'], ['Réseau', 'compteur', 'distributeur', '#f0f0f0']];
    if (iso && d.hybrid) { B.splice(2, 4, ['Onduleur hybride', `${d.inverter.Pcont} W – MPPT intégré`, `+ ${d.battery.cnt} batt. ${d.vbat} V / ${d.battery.p * d.battery.b.Ah} Ah`, '#bcd6ff'], ['Tableau AC', d.acBreaker ? `Disj. ${d.acBreaker} A + ID 30 mA` : '', '230 V', '#e0e6ee']); }
    const L = iso && d.hybrid ? [cs(d.Sdc), '', cs(d.Sac)] : iso ? [cs(d.Sdc), '', cs(d.Sbat), cs(d.Sbi), cs(d.Sac)] : [cs(d.Sdc), '', cs(d.Sac), ''];
    const w = 128, gap = 30, H = 120, W = B.length * w + (B.length - 1) * gap + 20;
    let o = `<svg class="pvsyn" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Synoptique de l'installation photovoltaïque">`;
    B.forEach((b, i) => { const x = 10 + i * (w + gap); o += `<rect x="${x}" y="24" width="${w}" height="70" rx="8" fill="${b[3]}" stroke="#333" stroke-width="1.4"/><text x="${x + w / 2}" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#17212b">${esc(b[0])}</text><text x="${x + w / 2}" y="62" text-anchor="middle" font-size="10" fill="#17212b">${esc(b[1])}</text><text x="${x + w / 2}" y="77" text-anchor="middle" font-size="9.5" fill="#333">${esc(b[2])}</text>`;
      if (i < B.length - 1) { const x2 = x + w; o += `<line x1="${x2}" y1="59" x2="${x2 + gap}" y2="59" stroke="#333" stroke-width="2"/><path d="M${x2 + gap - 6} 55 L${x2 + gap} 59 L${x2 + gap - 6} 63" fill="none" stroke="#333" stroke-width="2"/><text x="${x2 + gap / 2}" y="52" text-anchor="middle" font-size="8.5" fill="#444">${esc(L[i] || '')}</text>`; } });
    return o + '</svg>';
  }

  function resultHTML(st, res) {
    const M = EE.Config.money; let h = '';
    if (res.warns.length) h += `<div class="warn">${res.warns.map((w) => '⚠ ' + esc(w)).join('<br>')}</div>`;
    if (!res.ok) return h + '<p class="muted">Complétez la grille pour obtenir le dimensionnement.</p>';
    const d = res.design;
    h += `<div class="pvass"><b>Valeurs retenues :</b> ${res.assumptions.map((a) => `<span class="${a[2] ? 'std' : 'usr'}" title="${a[2] ? 'Valeur standard appliquée automatiquement' : 'Valeur saisie par vous'}">${esc(a[0])} : ${esc(a[1])}${a[2] ? ' <i>(standard)</i>' : ''}</span>`).join('')}</div>`;
    h += `<div class="pvcards">${d.kind === 'isole' ? `<div class="pvc"><small>Panneaux</small><b>${d.panelsN} × ${res.panel.W} Wc</b><span>${d.Pdc} Wc – ${d.np} chaîne(s) de ${d.ns}</span></div><div class="pvc"><small>Batteries</small><b>${d.battery.cnt} × ${esc(d.battery.b.name)}</b><span>${d.vbat} V – ${d.battery.p * d.battery.b.Ah} Ah</span></div>${d.hybrid ? `<div class="pvc"><small>Onduleur hybride (MPPT + chargeur intégrés)</small><b>${esc(d.inverter.name)}</b><span>Charge max ${d.inverter.Ichg} A – ${d.inverter.Pcont} W</span></div>` : `<div class="pvc"><small>Régulateur MPPT</small><b>${d.nr} × ${esc(d.mppt.name)}</b></div><div class="pvc"><small>Onduleur</small><b>${d.inverter ? d.ninv + ' × ' + esc(d.inverter.name) : '—'}</b></div>`}`
      : `<div class="pvc"><small>Panneaux</small><b>${d.panelsN} × ${res.panel.W} Wc</b><span>${d.Pdc} Wc – ${d.np} chaîne(s) de ${d.ns}</span></div><div class="pvc"><small>Onduleur réseau</small><b>${esc(d.inverter.name)}</b></div><div class="pvc"><small>Production estimée</small><b>${f1(d.prod)} kWh/jour</b></div>`}</div>`;
    const props = st.mode === 'reseau' ? [] : PV.proposals(st, EE.Config.get());
    if (props.length) {
      h += `<h2>Propositions <small class="muted">(choisissez la solution qui convient)</small></h2><div class="pvprops no-print">${props.map((o) => { const cur = (st.tech === o.pack.tech) && ((st.conv || 'separe') === o.pack.conv);
        if (!o.ok) return `<div class="pvprop"><h3>${esc(o.pack.name)}</h3><p class="small muted">${esc(o.pack.slogan)}</p><p class="small">Non réalisable avec le catalogue actuel (voir les avertissements).</p></div>`;
        return `<div class="pvprop${cur ? ' cur' : ''}${o.pack.id === 'moderne' ? ' reco' : ''}"><h3>${esc(o.pack.name)}</h3><p class="small muted">${esc(o.pack.slogan)}</p><ul class="small">
          <li><b>Batteries :</b> ${o.battery.cnt} × ${esc(o.battery.b.name)}</li><li><b>Stockage :</b> ${f1(o.nominalKWh)} kWh nominal, ${f1(o.usableKWh)} kWh utilisable (décharge ${Math.round(o.dod * 100)} %)</li>
          <li><b>Durée de vie indicative :</b> environ ${o.cycles} cycles, soit ${f1(o.years)} ans</li><li><b>Onduleur :</b> ${o.hybrid ? esc(o.inverter.name) + ' (1 appareil)' : `régulateur + onduleur (${o.devices} appareils)`}</li>
          <li><b>Panneaux :</b> ${o.panelsN} × ${o.res.panel.W} Wc – <b>tension :</b> ${o.vbat} V</li><li><b>Coût matériel :</b> ${o.priced ? M(o.total) : 'prix à renseigner dans le Portail'}</li></ul>
          ${cur ? '<span class="pill">✔ Choix actuel</span>' : `<button class="btn small primary" data-pack="${o.pack.id}">Choisir cette solution</button>`}</div>`; }).join('')}</div>
      <p class="small muted no-print">Durées de vie et décharge utile : valeurs indicatives modifiables dans le Portail (règles photovoltaïques). Le lithium (LiFePO4) accepte une décharge plus profonde, dure plus longtemps et pèse moins ; l'hybride réduit le câblage et permet la supervision à distance. Vérifier la compatibilité de communication entre batterie et onduleur (CAN / RS485) sur les fiches techniques.</p>`;
    }
    h += `<h2>Synoptique</h2><div class="qwrap">${synoptic(res)}</div>`;
    h += `<h2>Détail du dimensionnement</h2><div class="qwrap"><table class="qt"><thead><tr><th>Étape</th><th class="r">Valeur</th><th>Unité</th><th>Calcul</th></tr></thead><tbody>${res.steps.map((s) => `<tr><td>${esc(s.label)}</td><td class="r"><b>${f1(s.value)}</b></td><td>${esc(s.unit)}</td><td class="small muted">${esc(s.formula)}</td></tr>`).join('')}</tbody></table></div>`;
    h += `<h2>Liste du matériel</h2>${res.items.some((i) => !i.price) ? '<p class="muted small no-print">Prix à renseigner dans le Portail › Photovoltaïque (équipements) et › Catalogue (câbles et protections).</p>' : ''}<div class="qwrap"><table class="qt"><thead><tr><th>Désignation</th><th class="r">Qté</th><th>Unité</th><th class="r">Prix unitaire</th><th class="r">Total</th></tr></thead><tbody>`;
    let last = ''; res.items.forEach((i) => { if (i.cat !== last) { h += `<tr class="cat"><td colspan="5">${esc(i.cat)}</td></tr>`; last = i.cat; } h += `<tr><td>${esc(i.name)}${i.norm ? `<br><small class="muted">${esc(i.norm)}</small>` : ''}</td><td class="r"><b>${i.qty}</b></td><td>${esc(i.unit)}</td><td class="r">${i.price ? M(i.price) : '—'}</td><td class="r">${i.price ? M(i.total) : '—'}</td></tr>`; });
    h += `</tbody><tfoot><tr class="tot"><td colspan="4">TOTAL</td><td class="r">${M(res.totals.total)}</td></tr></tfoot></table></div>`;
    return h + '<p class="small muted">Dimensionnement indicatif établi avec les valeurs saisies et les règles du Portail. Les valeurs de panneaux, régulateurs, onduleurs et batteries du catalogue sont génériques : remplacez-les par les fiches techniques du matériel choisi. La conception finale doit être validée par un professionnel qualifié (règles d\'installation, HD 60364-7-712 pour les installations photovoltaïques).</p>';
  }

  function render() {
    const cfg = EE.Config.get(); let list = Studies.list();
    if (!list.length) { const s = PV.newStudy('Installation 1'); Studies.put(s); list = [s]; }
    if (!cur || !Studies.get(cur)) cur = list[0].id; const st = Studies.get(cur);
    const field = (label, inner, help) => `<label>${label}${inner}${help ? `<small>${help}</small>` : ''}</label>`;
    const num = (k, v, step) => `<input data-f="${k}" type="number" step="${step || 'any'}" min="0" value="${esc(v)}" inputmode="decimal">`;
    $('#main').innerHTML = `<div class="page"><div class="bar no-print"><h1>☀️ Photovoltaïque</h1><div class="grow"></div><select id="vsel" aria-label="Installation">${list.map((s) => `<option value="${s.id}"${s.id === cur ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <button class="btn" id="vnew">Nouvelle</button><button class="btn" id="vren">Renommer</button><button class="btn" id="vdup">Dupliquer</button><button class="btn danger" id="vdel">Supprimer</button></div>
      <p class="muted no-print">Remplissez la grille : l'application calcule les panneaux, les chaînes, le régulateur, l'onduleur, les batteries, les câbles et les protections.</p>
      <div class="printonly phead"><b>${esc(cfg.brand.company)}</b><br>${esc(cfg.brand.contact)}<br>Étude : <b>${esc(st.name)}</b> – ${EE.fmtDate(Date.now())}</div>
      <section class="card flat no-print"><h2>1. Type d'installation</h2><div class="pvgrid">${field('Que voulez-vous installer ?', `<select data-f="mode"><option value="isole">Site isolé (avec batteries)</option><option value="reseau">Raccordé au réseau (sans batterie)</option></select>`)}</div>
        <p class="small muted">Seules les informations ci-dessous sont obligatoires. Tout le reste est réglé automatiquement avec des valeurs moyennes et usuelles (voir « Valeurs retenues » dans le résultat).</p></section>
      <section class="card flat no-print"><h2>2. Appareils à alimenter <small class="muted">(* obligatoire)</small></h2><div class="qwrap"><table class="qt in"><thead><tr><th>Appareil</th><th>Puissance (W) *</th><th>Quantité *</th><th>Heures / jour *</th><th title="Facultatif. Surintensité au démarrage : 1 = aucune, 3 à 6 pour un moteur (frigo, pompe)">Démarrage × <small>(facultatif)</small></th><th></th></tr></thead><tbody id="vloads"></tbody></table></div>
        <div class="btnrow"><button class="btn" id="vaddl">＋ Ajouter une ligne</button><select id="vpre" aria-label="Appareil courant"><option value="">＋ Appareil courant…</option>${PV.PRESETS.map((p, i) => `<option value="${i}">${esc(p[0])} (${p[1]} W)</option>`).join('')}</select></div><p class="small muted">Les valeurs des appareils courants sont indicatives : relevez la puissance sur la plaque signalétique de vos appareils.</p></section>
      <details class="card flat no-print"><summary><b>Réglages avancés (facultatif)</b> – des valeurs standard sont déjà appliquées</summary><div class="pvgrid" style="margin-top:10px">
        ${field('Heures de plein soleil (kWh/m²/jour)', num('hsp', st.hsp), 'Valeur moyenne par défaut ; mettez celle de votre site (mois le plus défavorable)')}
        ${field('Température minimale du site (°C)', `<input data-f="tmin" type="number" step="any" value="${esc(st.tmin)}">`)}
        ${field('Température maximale des cellules (°C)', `<input data-f="tcell" type="number" step="any" value="${esc(st.tcell)}">`, 'Environ 65 °C en climat chaud')}
        ${field('Panneau', `<select data-f="panel"><option value="auto">Automatique (le mieux adapté)</option>${cfg.pv.panels.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`)}
        <div class="iso">${field('Tension du parc de batteries', `<select data-f="vbat"><option value="auto">Automatique</option><option>12</option><option>24</option><option>48</option></select>`)}</div>
        <div class="iso">${field('Type de batteries', `<select data-f="tech"><option value="lithium">Lithium LiFePO4 (moderne, recommandé)</option><option value="plomb">Plomb (AGM / gel / stationnaire)</option></select>`)}</div>
        <div class="iso">${field('Type d\'onduleur', `<select data-f="conv"><option value="hybride">Hybride tout-en-un (onduleur + chargeur + MPPT)</option><option value="separe">Séparés (régulateur MPPT + onduleur / chargeur)</option></select>`)}</div>
        <div class="iso">${field('Autonomie sans soleil (jours)', num('days', st.days), 'Usage courant : 1 à 3 jours')}</div>
        <div class="iso">${field('Coefficient de simultanéité', num('sim', st.sim), 'Part de la puissance installée utilisée en même temps (0 à 1)')}</div>
        <div class="iso"><label class="chk"><input data-f="acLoads" type="checkbox"> Appareils en courant alternatif (onduleur)</label></div>
        <div class="grid">${field('Couverture de la consommation visée (%)', num('coverage', st.coverage))}${field('Puissance crête imposée (Wc, 0 = automatique)', num('kwc', st.kwc))}</div>
        ${field('Distance panneaux → régulateur / onduleur (m)', num('d.dc', st.dist.dc))}
        <div class="iso">${field('Distance régulateur → batteries (m)', num('d.bat', st.dist.bat))}</div><div class="iso">${field('Distance batteries → onduleur (m)', num('d.bi', st.dist.bi))}</div>
        ${field('Distance onduleur → tableau AC (m)', num('d.ac', st.dist.ac))}</div></details>
      <div class="btnrow no-print"><button class="btn primary" id="vcsv">Exporter en CSV (Excel)</button><button class="btn" id="vprint">Imprimer / enregistrer en PDF</button></div><div id="vres"></div></div>`;
    // valeurs
    const setv = (k, v) => { const e = $(`[data-f="${k}"]`); if (!e) return; if (e.type === 'checkbox') e.checked = !!v; else e.value = v; };
    ['mode', 'panel', 'vbat', 'tech'].forEach((k) => setv(k, st[k])); setv('conv', st.conv || 'separe'); setv('acLoads', st.acLoads !== false);
    const iso = () => { $$('.iso').forEach((e) => e.classList.toggle('hide', st.mode !== 'isole')); const gd = $('.grid'); gd.classList.toggle('hide', st.mode !== 'reseau'); $$('.grid label').forEach((l) => (l.style.display = '')); };
    const $$ = (s) => [...document.querySelectorAll(s)];
    const drawLoads = () => { $('#vloads').innerHTML = st.loads.map((l, i) => `<tr data-i="${i}"><td><input data-k="name" value="${esc(l.name)}" style="width:210px"></td><td><input data-k="P" type="number" min="0" step="any" value="${esc(l.P)}" style="width:80px"></td><td><input data-k="n" type="number" min="0" step="1" value="${esc(l.n)}" style="width:60px"></td><td><input data-k="h" type="number" min="0" max="24" step="any" value="${esc(l.h)}" style="width:70px"></td><td><input data-k="start" type="number" min="1" step="any" value="${esc(l.start)}" style="width:60px"></td><td><button class="btn small danger" data-del="${i}" aria-label="Supprimer">✕</button></td></tr>`).join(''); };
    const recompute = () => { const res = PV.compute(st, EE.Config.get()); EE.lastPV = { study: st, res }; $('#vres').innerHTML = resultHTML(st, res); };
    const soon = () => { clearTimeout(timer); timer = setTimeout(() => Studies.put(st), 200); recompute(); };
    drawLoads(); iso(); recompute();
    $('.page').addEventListener('input', (e) => {
      const t = e.target, f = t.dataset.f, tr = t.closest('#vloads tr');
      if (tr && t.dataset.k) { st.loads[+tr.dataset.i][t.dataset.k] = t.value; soon(); return; }
      if (!f) return; const v = t.type === 'checkbox' ? t.checked : t.value;
      if (f.startsWith('d.')) st.dist[f.slice(2)] = v; else st[f] = (['mode', 'panel', 'tech'].includes(f) || t.type === 'checkbox') ? v : v;
      if (f === 'mode') iso(); soon();
    });
    $('#vres').onclick = (e) => { const b = e.target.closest('[data-pack]'); if (!b) return; const pk = PV.PACKS.find((x) => x.id === b.dataset.pack); st.tech = pk.tech; st.conv = pk.conv; setv('tech', st.tech); setv('conv', st.conv); Studies.put(st); recompute(); ui().toast('Solution « ' + pk.name + ' » appliquée', 'ok'); };
    $('#vloads').onclick = (e) => { const b = e.target.closest('[data-del]'); if (!b) return; st.loads.splice(+b.dataset.del, 1); drawLoads(); Studies.put(st); recompute(); };
    $('#vaddl').onclick = () => { st.loads.push({ name: 'Appareil', P: 50, n: 1, h: 4, start: 1 }); drawLoads(); Studies.put(st); recompute(); };
    $('#vpre').onchange = (e) => { if (e.target.value === '') return; const p = PV.PRESETS[+e.target.value]; st.loads.push({ name: p[0], P: p[1], n: 1, h: p[2], start: p[3] || 1 }); e.target.value = ''; drawLoads(); Studies.put(st); recompute(); };
    $('#vsel').onchange = (e) => { cur = e.target.value; render(); };
    const nameBox = (title, val) => ui().modal({ title, body: `<label>Nom<input id="vn" value="${esc(val)}" maxlength="60"></label>`, buttons: [{ label: 'Annuler', value: null }, { label: 'Valider', cls: 'primary', value: () => ($('#vn').value.trim() || null) }] });
    $('#vnew').onclick = async () => { const n = await nameBox('Nouvelle installation', ''); if (!n) return; const s = PV.newStudy(n); Studies.put(s); cur = s.id; render(); };
    $('#vren').onclick = async () => { const n = await nameBox('Renommer', st.name); if (!n) return; st.name = n; Studies.put(st); render(); };
    $('#vdup').onclick = () => { const c = EE.clone(st); c.id = EE.uid('v'); c.name = st.name + ' (copie)'; Studies.put(c); cur = c.id; render(); };
    $('#vdel').onclick = async () => { if (await ui().confirmBox('Supprimer l\'installation', `Supprimer « <b>${esc(st.name)}</b> » ?`, 'Supprimer')) { Studies.remove(st.id); cur = null; render(); } };
    $('#vcsv').onclick = () => { const res = PV.compute(st, EE.Config.get()); EE.Export.download('Photovoltaique_' + EE.Export.safe(st.name) + '.csv', new Blob([PV.toCSV(st, res)], { type: 'text/csv;charset=utf-8' })); ui().toast('Fichier CSV prêt', 'ok'); };
    $('#vprint').onclick = () => g.print();
  }
  EE.Screens = EE.Screens || {}; EE.Screens.pv = render;
})(window);

</script>
<script>
/* Yak-élec-pro – écran « Composants et symboles » : liste du catalogue avec le symbole de chaque composant */
(function (g) {
  'use strict';
  const EE = g.EE, esc = EE.esc, $ = (s, r = document) => r.querySelector(s);
  function rows() {
    const cfg = EE.Config.get(), seen = {};
    return cfg.catalog.map((c) => { const m = EE.Config.symOf(c.id), d = c.sym ? EE.Library.get(c.sym) : null; return { c, d, note: m.note }; });
  }
  function render() {
    const R = rows(), cats = [...new Set(R.map((r) => r.c.cat))], withSym = R.filter((r) => r.d).length, q = EE.compoQ || '';
    const vis = R.filter((r) => (r.c.name + r.c.cat).toLowerCase().includes(q.toLowerCase()));
    $('#main').innerHTML = `<div class="page"><div class="bar no-print"><h1>Composants et symboles</h1><div class="grow"></div><input id="cmq" placeholder="Rechercher…" value="${esc(q)}"><button class="btn" id="cmcsv">Exporter (CSV)</button><button class="btn" id="cmprint">Imprimer / PDF</button></div>
      <p class="muted">Liste de tous les composants du catalogue avec le symbole de la bibliothèque qui les représente. ${withSym} composant(s) sur ${R.length} ont un symbole ; les autres sont indiqués « aucun symbole » (rien n'est inventé).</p>
      ${cats.map((cat) => { const L = vis.filter((r) => r.c.cat === cat); return L.length ? `<h2>${esc(cat)}</h2><div class="qwrap"><table class="qt cmp"><thead><tr><th style="width:90px">Symbole</th><th>Composant</th><th>Symbole de la bibliothèque</th><th>Remarque et norme européenne</th></tr></thead><tbody>${L.map((r) => `<tr><td>${r.d ? EE.app.ui.symbol(r.d.id, 64) : '<span class="muted">—</span>'}</td><td>${esc(r.c.name)}</td><td>${r.d ? `<b>${esc(r.d.name)}</b><br><small class="muted">${esc(r.d.ref.split(';')[0])}</small>` : '<span class="muted">aucun symbole dans la bibliothèque</span>'}</td><td class="small muted">${esc(r.note)}${r.c.norm ? `<br><b>Norme :</b> ${esc(r.c.norm)}` : ''}</td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}
      <p class="small muted">Symboles redessinés de façon simplifiée d'après les principes de la norme NF EN 60617 (CEI 60617) ; ils ne reproduisent pas les planches de la norme. Pour un dossier officiel ou un examen, vérifiez la forme exacte dans la norme en vigueur. Le symbole d'un composant peut être corrigé dans le Portail › Catalogue.</p></div>`;
    $('#cmq').oninput = (e) => { EE.compoQ = e.target.value; render(); const i = $('#cmq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
    $('#cmprint').onclick = () => g.print();
    $('#cmcsv').onclick = () => { const q2 = (v) => '"' + String(v).replace(/"/g, '""') + '"'; const L = ['Catégorie;Composant;Symbole de la bibliothèque;Remarque;Norme']; R.forEach((r) => L.push([r.c.cat, r.c.name, r.d ? r.d.name : 'aucun symbole', r.note, r.c.norm || ''].map(q2).join(';'))); EE.Export.download('composants_et_symboles.csv', new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' })); };
  }

<script>
/* Yak-élec-pro – Portail administrateur : modifier l'application sans programmer */
(function (g) {
  'use strict';
  const EE = g.EE, esc = EE.esc, C = () => EE.Config;
  const ui = () => EE.app.ui, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  let tab = 'look';
  const TABS = [['look', '🎨 Apparence et textes'], ['cat', '📦 Catalogue et prix'], ['rules', '📐 Règles de calcul'], ['pv', '☀️ Photovoltaïque'], ['sym', '🔣 Fiches des symboles'], ['save', '💾 Sauvegarde et mise à jour'], ['remote', '📡 Contrôle à distance']];

  function renderPortal() {
    const u = EE.Store.Users.current();
    const box = (inner) => ($('#main').innerHTML = `<div class="page narrow">${inner}</div>`);
    if (!C().isAdmin(u)) { box('<section class="card flat"><p>Accès refusé.</p></section>'); return; }
    if (!EE.portalUnlocked) {
      box(`<h1>🛠️ Portail administrateur</h1><section class="card flat"><p>Zone protégée. Entrez le mot de passe administrateur.</p>${ui().pwField('pp', 'Mot de passe administrateur')}<p class="err" id="perr"></p><button class="btn primary" id="punlock">Entrer dans le portail</button></section>`);
      ui().bindEyes($('.page'));
      const go = () => {
        if (Date.now() < (EE.portalLockUntil || 0)) { $('#perr').textContent = 'Trop d\'essais : patientez quelques secondes.'; return; }
        if (C().checkAdminPassword($('#pp').value)) { EE.portalUnlocked = true; EE.portalFails = 0; C().log('Entrée dans le portail'); renderPortal(); return; }
        EE.portalFails = (EE.portalFails || 0) + 1; if (EE.portalFails >= 5) { EE.portalLockUntil = Date.now() + 30000; EE.portalFails = 0; }
        $('#perr').textContent = 'Mot de passe incorrect.';
      };
      $('#punlock').onclick = go; $('#pp').onkeydown = (e) => { if (e.key === 'Enter') go(); };
      return;
    }
    $('#main').innerHTML = `<div class="page"><div class="bar"><h1>🛠️ Portail administrateur</h1><div class="grow"></div><button class="btn small" id="plock">🔒 Verrouiller</button></div>
      <p class="muted">Modifiez l'application avec de simples formulaires : aucune programmation. Les changements s'appliquent immédiatement sur cet appareil ; pour les mettre sur un autre appareil, utilisez « Sauvegarde et mise à jour ».</p>
      <div class="chips ptabs">${TABS.map(([k, l]) => `<button class="chip${k === tab ? ' on' : ''}" data-t="${k}">${l}</button>`).join('')}</div><div id="pbody"></div></div>`;
    $('#plock').onclick = () => { EE.portalUnlocked = false; EE.app.go('home'); };
    $$('.ptabs .chip').forEach((b) => (b.onclick = () => { tab = b.dataset.t; renderPortal(); }));
    ({ look, cat: catalogue, rules, pv: pvTab, sym: symbols, save: backup, remote: remoteTab })[tab]($('#pbody'));
  }

  // ---------- 1. Apparence ----------
  function look(el) {
    const cf = C().get(), b = cf.brand;
    el.innerHTML = `<section class="card flat"><h2>Nom, textes et contact</h2>
      <div class="two"><label>Nom de l'application (partie normale)<input id="b1" value="${esc(b.name1)}"></label><label>Nom (partie colorée)<input id="b2" value="${esc(b.name2)}"></label></div>
      <label>Slogan (écran de connexion)<input id="bs" value="${esc(b.slogan)}"></label>
      <label>Message d'accueil (après « Bonjour … – »)<input id="bw" value="${esc(b.welcome)}"></label>
      <label>Entreprise / établissement (en-tête des devis imprimés)<input id="bc" value="${esc(b.company)}"></label>
      <label>Contact (téléphone, adresse, e-mail)<input id="bt" value="${esc(b.contact)}"></label>
      <h4>Page « Contact » (vos coordonnées)</h4>
      <label>Votre nom<input id="on" value="${esc((b.owner || {}).name || '')}" placeholder="Prénom et nom"></label>
      <div class="two"><label>E-mail<input id="oe" type="email" value="${esc((b.owner || {}).email || '')}"></label><label>Téléphone / WhatsApp (avec l'indicatif)<input id="op" value="${esc((b.owner || {}).phone || '')}"></label></div>
      <label>Monnaie des prix<input id="bm" value="${esc(cf.currency)}" maxlength="8" style="max-width:140px"></label></section>
      <section class="card flat"><h2>Couleurs</h2><div class="two"><label>Couleur principale (en-tête)<input id="bcol" type="color" value="${esc(b.color)}"></label><label>Couleur d'accent (boutons)<input id="bacc" type="color" value="${esc(b.accent)}"></label></div></section>
      <section class="card flat"><h2>Logo</h2><div class="logoprev"><img id="lprev" src="${EE.LOGO_FULL}" alt="Logo actuel"></div>
        <div class="btnrow"><label class="btn" for="lfile">Choisir une image (PNG, JPG)…</label><input id="lfile" type="file" accept="image/*" class="hide"><button class="btn" id="lreset">Rétablir le logo d'origine</button></div>
        <p class="small muted">Conseil : image sur fond transparent (PNG), largeur d'au moins 400 pixels.</p></section>
      <div class="btnrow"><button class="btn primary" id="lsave">Enregistrer l'apparence</button><button class="btn" id="lrst">Tout rétablir (apparence)</button></div>`;
    $('#lsave').onclick = () => { C().set((c) => { Object.assign(c.brand, { name1: $('#b1').value, name2: $('#b2').value, slogan: $('#bs').value, welcome: $('#bw').value, company: $('#bc').value, contact: $('#bt').value, owner: { name: $('#on').value.trim(), email: $('#oe').value.trim(), phone: $('#op').value.trim() }, color: $('#bcol').value, accent: $('#bacc').value }); c.currency = $('#bm').value.trim() || 'GNF'; }, 'Apparence et textes modifiés'); ui().toast('Apparence enregistrée', 'ok'); renderPortalShell(); };
    $('#lrst').onclick = async () => { if (await ui().confirmBox('Rétablir l\'apparence', 'Remettre le nom, les textes, les couleurs et le logo d\'origine ?', 'Rétablir')) { C().reset('brand'); renderPortalShell(); } };
    $('#lreset').onclick = () => { C().set((c) => (c.brand.logo = null), 'Logo d\'origine rétabli'); renderPortalShell(); };
    $('#lfile').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, 700 / im.width), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);

  function renderPortalShell() { const t = tab; const y = g.scrollY; EE.app.go('portal'); tab = t; g.scrollTo(0, y); }

  // ---------- 2. Catalogue ----------
  function catalogue(el, q = '') {
    const cf = C().get(), cats = [...new Set(cf.catalog.map((c) => c.cat))];
    const rows = cf.catalog.map((c, i) => ({ c, i })).filter(({ c }) => (c.name + c.cat + c.id).toLowerCase().includes(q.toLowerCase()));

      <p class="small muted">Modifiez directement un prix ou un nom : l'enregistrement est automatique. Le <b>nombre de modules</b> (18 mm) sert à calculer la place dans le coffret. Les articles « Coffret » indiquent le nombre de rangées et de modules par rangée.</p>
      <div class="btnrow"><button class="btn primary" id="cadd">＋ Ajouter un article</button><button class="btn" id="cinc">Augmenter / baisser tous les prix de…</button><button class="btn" id="cexp">Exporter (CSV / Excel)</button><label class="btn" for="cimp">Importer un CSV…</label><input id="cimp" type="file" accept=".csv,text/csv" class="hide"></div>
      <div class="qwrap"><table class="qt in"><thead><tr><th>Catégorie</th><th>Désignation</th><th>Unité</th><th class="r">Prix (${esc(cf.currency)})</th><th class="r">Modules</th><th class="r">Rangées</th><th class="r">Mod./rang.</th><th>Norme</th><th>Symbole</th><th>Photo</th><th></th></tr></thead><tbody id="ctb">${rows.map(({ c, i }) => `<tr data-i="${i}"><td><input data-k="cat" value="${esc(c.cat)}" list="cats" style="width:110px"></td><td><input data-k="name" value="${esc(c.name)}" style="width:300px"></td><td><input data-k="unit" value="${esc(c.unit)}" style="width:50px"></td><td><input data-k="price" type="number" min="0" step="any" value="${c.price || 0}" style="width:100px"></td><td><input data-k="mods" type="number" min="0" step="1" value="${c.mods || 0}" style="width:60px"></td><td><input data-k="rows" type="number" min="0" step="1" value="${c.rows || ''}" style="width:60px"></td><td><input data-k="perRow" type="number" min="0" step="1" value="${c.perRow || ''}" style="width:60px"></td><td><input data-k="norm" value="${esc(c.norm || '')}" style="width:190px"></td><td class="symcell">${EE.app.ui.symbol(c.sym, 30)}<select data-k="sym" style="max-width:150px"><option value="">— aucun —</option>${EE.Library.list.map((d) => `<option value="${d.id}"${d.id === c.sym ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select></td><td class="symcell">${c.img ? `<img src="${c.img}" alt="" class="cphoto"><button class="btn small" data-noimg="${i}" aria-label="Retirer la photo">✕</button>` : ''}<label class="btn small" for="ph${i}" title="Ajouter une photo de l'appareil">📷</label><input id="ph${i}" type="file" accept="image/*" class="hide" data-photo="${i}"></td><td><button class="btn small danger" data-del="${i}" aria-label="Supprimer">✕</button></td></tr>`).join('') || '<tr><td colspan="11" class="muted">Aucun article.</td></tr>'}</tbody></table></div><datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></section>`;
    $('#cq').oninput = (e) => { catalogue(el, e.target.value); const i = $('#cq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
    $('#ctb').onchange = (e) => { const tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k) return; let v = e.target.value; if (['price', 'mods', 'rows', 'perRow'].includes(k)) v = Math.max(0, parseFloat(v) || 0); C().set((c) => { const it = c.catalog[+tr.dataset.i]; if (['rows', 'perRow'].includes(k) && !v) delete it[k]; else if (k === 'sym') it.sym = v || null; else it[k] = v; }, null); if (k === 'sym') catalogue(el, q); };

      const inp = e.target.closest('[data-photo]'); if (!inp || !inp.files[0]) return; const idx = +inp.dataset.photo, f = inp.files[0];
      const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 260 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height); const url = cv.toDataURL('image/jpeg', 0.82); C().set((c) => (c.catalog[idx].img = url), 'Photo ajoutée : ' + cf.catalog[idx].name); ui().toast('Photo enregistrée', 'ok'); catalogue(el, q); }; im.onerror = () => ui().toast('Image illisible.', 'bad'); im.src = rd.result; }; rd.readAsDataURL(f);

    $('#cadd').onclick = async () => {
      const r = await ui().modal({ title: 'Nouvel article', wide: false, body: `<label>Catégorie<input id="na" list="cats" value="Appareillage"></label><label>Désignation<input id="nn"></label><div class="two"><label>Unité<input id="nu" value="pce"></label><label>Prix<input id="np" type="number" min="0" step="any" value="0"></label></div><label>Modules de 18 mm (appareils de protection, sinon 0)<input id="nm" type="number" min="0" step="1" value="0"></label><label>Identifiant technique (facultatif, ex. disj_45)<input id="ni"></label>`, buttons: [{ label: 'Annuler', value: null }, { label: 'Ajouter', cls: 'primary', value: () => ({ cat: $('#na').value.trim() || 'Autres', name: $('#nn').value.trim(), unit: $('#nu').value.trim() || 'pce', price: +$('#np').value || 0, mods: +$('#nm').value || 0, id: $('#ni').value.trim() }) }] });
      if (!r || !r.name) return; r.id = r.id || EE.uid('x'); if (cf.catalog.some((c) => c.id === r.id)) return ui().toast('Cet identifiant existe déjà.', 'bad');

    $('#cexp').onclick = () => { const L = ['id;categorie;designation;unite;prix;modules;rangees;modules_par_rangee']; cf.catalog.forEach((c) => L.push([c.id, c.cat, c.name, c.unit, c.price || 0, c.mods || 0, c.rows || '', c.perRow || ''].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(';'))); EE.Export.download('catalogue_materiel.csv', new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' })); };
    $('#cimp').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const n = importCSV(await f.text()); ui().toast(n + ' article(s) importé(s) ou mis à jour', 'ok'); catalogue(el, q); } catch (er) { ui().toast(er.message, 'bad'); } };
  }
  function parseCSV(t) {
    t = t.replace(/^﻿/, ''); const sep = (t.split('\n')[0].match(/;/g) || []).length >= (t.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < t.length; i++) { const ch = t[i]; if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some((x) => x !== '')) rows.push(row); row = []; } else cur += ch; }
    row.push(cur); if (row.some((x) => x !== '')) rows.push(row); return rows;
  }
  function importCSV(text) {
    const rows = parseCSV(text); if (rows.length < 2) throw new Error('Fichier vide.');
    const h = rows[0].map((x) => x.trim().toLowerCase()); const ix = (n) => h.indexOf(n); if (ix('id') < 0 || ix('designation') < 0 || ix('prix') < 0) throw new Error('Colonnes attendues : id;categorie;designation;unite;prix;modules;rangees;modules_par_rangee');
    let n = 0; const num = (v) => { const x = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : 0; };
    C().set((c) => { rows.slice(1).forEach((r) => { const id = (r[ix('id')] || '').trim(); if (!id) return; let it = c.catalog.find((x) => x.id === id); if (!it) { it = { id, cat: 'Autres', name: id, unit: 'pce', price: 0, mods: 0 }; c.catalog.push(it); } if (ix('categorie') >= 0 && r[ix('categorie')]) it.cat = r[ix('categorie')]; it.name = r[ix('designation')] || it.name; if (ix('unite') >= 0 && r[ix('unite')]) it.unit = r[ix('unite')]; it.price = num(r[ix('prix')]); if (ix('modules') >= 0) it.mods = num(r[ix('modules')]); if (ix('rangees') >= 0 && num(r[ix('rangees')])) it.rows = num(r[ix('rangees')]); if (ix('modules_par_rangee') >= 0 && num(r[ix('modules_par_rangee')])) it.perRow = num(r[ix('modules_par_rangee')]); n++; }); }, 'Import du catalogue (CSV)');
    return n;
  }

    sync();
    $('#rsave').onclick = () => { C().set((c) => { c.remote = { url: $('#rurl').value.trim(), minutes: Math.max(1, +$('#rmin').value || 15) }; }, 'Contrôle à distance : réglages'); ui().toast('Réglages enregistrés', 'ok'); remoteTab(el); };
    $('#rcheck').onclick = async () => { const r = await R.check(); ui().toast(r.ok ? 'Fichier de contrôle lu' : r.error === 'no-url' ? 'Aucune adresse configurée' : 'Échec : ' + r.error, r.ok ? 'ok' : 'bad'); remoteTab(el); };
    $('#rload').onclick = async () => { const r = await R.check(); if (!r.ok) { ui().toast(r.error === 'no-url' ? 'Aucune adresse configurée' : 'Échec : ' + r.error, 'bad'); return; } const c = r.ctl; Object.assign(RF, { blocked: !!c.blocked, message: c.message || '', devices: (c.blockedDevices || []).join('\n'), users: (c.blockedUsers || []).join('\n'), latest: c.latestVersion || '', url: c.updateUrl || '', notes: c.updateNotes || '', min: c.minVersion || '', offline: c.maxOfflineDays || '' }); remoteTab(el); ui().toast('Fichier publié chargé', 'ok'); };
    $('#fcopy').onclick = async () => { try { await navigator.clipboard.writeText($('#fj').value); ui().toast('Copié', 'ok'); } catch (e) { $('#fj').select(); ui().toast('Sélectionné : copiez avec Ctrl+C', 'info'); } };
    $('#fdl').onclick = () => EE.Export.download('control.json', new Blob([$('#fj').value], { type: 'application/json' }));
    $('#fprev').onclick = () => R.preview(gen());
    $('#gpub').onclick = async () => {
      const o = $('#go').value.trim(), r = $('#gr').value.trim(), b = $('#gb').value.trim() || 'main', p = $('#gp').value.trim().replace(/^\/+/, ''), t = $('#gt').value.trim(), msg = $('#gmsg');
      Object.assign(RF, { owner: o, repo: r, branch: b, path: p });
      if (!o || !r || !p || !t) { msg.textContent = 'Renseignez le compte, le dépôt, le chemin et le jeton.'; msg.style.color = 'var(--bad)'; return; }
      msg.style.color = ''; msg.textContent = 'Envoi…';
      try {
        const api = `https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/${p.split('/').map(encodeURIComponent).join('/')}`, H = { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
        let sha; const g1 = await fetch(api + '?ref=' + encodeURIComponent(b), { headers: H, cache: 'no-store' }); if (g1.ok) sha = (await g1.json()).sha; else if (g1.status !== 404) throw new Error('lecture refusée (HTTP ' + g1.status + ')');
        const body = { message: 'Contrôle à distance : mise à jour du fichier', content: btoa(unescape(encodeURIComponent($('#fj').value))), branch: b }; if (sha) body.sha = sha;
        const g2 = await fetch(api, { method: 'PUT', headers: H, body: JSON.stringify(body) }); if (!g2.ok) throw new Error('écriture refusée (HTTP ' + g2.status + ')');
        $('#gt').value = ''; msg.style.color = 'var(--ok)'; msg.textContent = '✔ Publié. Les copies connectées l\'appliqueront dans quelques minutes (délai du cache GitHub : environ 5 min).'; C().log && C().log('Contrôle à distance publié');
      } catch (e) { msg.style.color = 'var(--bad)'; msg.textContent = 'Échec : ' + (e.message || e); }
    };
  }

  // ---------- 5. Sauvegarde / mise à jour ----------
  function backup(el) {
    el.innerHTML = `<section class="card flat"><h2>Sauvegarder la configuration</h2><p>Enregistre dans un fichier : apparence, logo, catalogue et prix, règles, appareils spécialisés et fiches des symboles.</p><button class="btn primary" id="bexp">Télécharger la configuration</button></section>
      <section class="card flat"><h2>Mettre à jour depuis un fichier</h2><p>Charge un fichier de configuration (créé ici ou reçu d'un collègue). Il <b>remplace</b> la configuration actuelle de cet appareil.</p><label class="btn" for="bimp">Choisir un fichier de configuration…</label><input id="bimp" type="file" accept=".json,application/json" class="hide"></section>
      <section class="card flat"><h2>Rétablir</h2><button class="btn danger" id="bres">Tout remettre aux réglages d'origine</button></section>
      <section class="card flat"><h2>Journal des modifications</h2>${C().logs().length ? `<ul class="log">${C().logs().map((l) => `<li><em>${EE.fmtDate(l.t)}</em> ${esc(l.what)}</li>`).join('')}</ul>` : '<p class="muted">Aucune modification pour le moment.</p>'}</section>
      <section class="card flat"><h2>Version</h2><p class="small muted">Version de l'application : ${EE.VERSION}. La mise à jour du <i>programme</i> lui-même se fait en remplaçant le fichier de l'application ; votre configuration et vos projets sont conservés sur l'appareil.</p></section>`;
    $('#bexp').onclick = () => { EE.Export.download('yak-elec-pro_configuration.json', new Blob([C().exportJSON()], { type: 'application/json' })); C().log('Configuration exportée'); ui().toast('Configuration téléchargée', 'ok'); };
    $('#bimp').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; if (!(await ui().confirmBox('Remplacer la configuration', 'Ce fichier va remplacer la configuration actuelle. Continuer ?', 'Remplacer'))) return; try { C().importJSON(await f.text()); ui().toast('Configuration mise à jour', 'ok'); renderPortalShell(); } catch (er) { ui().toast(er.message, 'bad'); } };
    $('#bres').onclick = async () => { if (await ui().confirmBox('Tout rétablir', 'Remettre l\'apparence, le catalogue, les règles et les fiches aux valeurs d\'origine ?', 'Tout rétablir')) { C().reset(); ui().toast('Réglages d\'origine rétablis', 'ok'); renderPortalShell(); } };
  }
  EE.Screens = EE.Screens || {}; EE.Screens.portal = renderPortal;
})(window);

</script>
<script>
/* Yak-élec-pro – application : écrans, navigation, boîtes de dialogue */
(function (g) {
  'use strict';
  const EE = g.EE, Lib = EE.Library, St = EE.Store, esc = EE.esc;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const LOGO = (s = 34) => `<svg class="logo" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#0b3d6b"/><path d="M27 6 13 27h9l-3 15 16-23h-10z" fill="#ffc83d"/></svg>`;
  const app = { screen: 'home', project: null, editor: null, saveT: null, dirty: false };
  EE.app = app;

  // ---------- utilitaires UI ----------
  function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3600); }
  function modal({ title, body, buttons, wide }) {
    return new Promise((res) => {
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div class="mb">${body}</div><div class="mf">${(buttons || []).map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
      document.body.appendChild(ov);
      const close = (v) => { ov.remove(); res(v); };
      ov.addEventListener('click', (e) => { if (e.target === ov) close(null); const b = e.target.closest('button[data-i]'); if (!b) return; const spec = buttons[+b.dataset.i]; close(spec.value !== undefined ? (typeof spec.value === 'function' ? spec.value(ov) : spec.value) : null); });
      const first = $('input,select', ov); first && first.focus();
      ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(null); if (e.key === 'Enter' && e.target.tagName === 'INPUT') { const ok = $('.btn.primary', ov); ok && ok.click(); } });
    });
  }
  const confirmBox = (title, msg, okLabel = 'Confirmer', danger = true) => modal({ title, body: `<p>${msg}</p>`, buttons: [{ label: 'Annuler', value: false }, { label: okLabel, cls: danger ? 'danger' : 'primary', value: true }] });
  const opts = (arr, sel) => arr.map((a) => `<option value="${esc(a)}"${a === sel ? ' selected' : ''}>${esc(a)}</option>`).join('');
  const schemaOpts = (sel) => Object.entries(EE.SCHEMAS).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${v}</option>`).join('');

  async function projectDialog(p, schema0) {
    const r = await modal({
      title: p ? 'Modifier le projet' : 'Nouveau projet',
      body: `<label>Nom du projet<input id="pn" maxlength="80" value="${esc(p ? p.name : '')}" placeholder="Ex. : Éclairage salon – va-et-vient"></label>
        <label>Type d'installation<select id="pi">${opts(EE.INSTALLS, p ? p.install : EE.INSTALLS[0])}</select></label>
        <label>Type de schéma<select id="ps">${schemaOpts(p ? p.schema : schema0 || St.Settings.get().schema || 'developpe')}</select></label><p class="err" id="perr"></p>`,
      buttons: [{ label: 'Annuler', value: null }, { label: p ? 'Enregistrer' : 'Créer le projet', cls: 'primary', value: (ov) => ({ name: $('#pn', ov).value, install: $('#pi', ov).value, schema: $('#ps', ov).value }) }],
    });
    return r;
  }

  // champ mot de passe avec bouton « afficher / masquer »
  const pwField = (id, label, extra = '') => `<label${extra}>${label}<span class="pw"><input id="${id}" type="password" autocomplete="off"><button type="button" class="eye" data-eye="${id}" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher / masquer le mot de passe">👁</button></span></label>`;
  function bindEyes(root = document) {
    $$('[data-eye]', root).forEach((b) => (b.onclick = (ev) => {
      ev.preventDefault(); const i = $('#' + b.dataset.eye); const show = i.type === 'password'; i.type = show ? 'text' : 'password';
      b.textContent = show ? '🙈' : '👁'; b.setAttribute('aria-pressed', show); b.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); i.focus();
    }));
  }

  // ---------- squelette ----------
  const Cf = () => EE.Config.get();
  const showPortal = (u) => EE.Config.isAdmin(u);
  function shell() {
    EE.Config.apply();
    const u = St.Users.current();
    document.documentElement.dataset.theme = u ? St.Settings.get().theme : 'light';
    if (!u) return renderLogin();
    $('#app').innerHTML = `<header class="top"><div class="brandcol"><a class="brand" data-go="home"><img class="logoimg ico" src="${EE.LOGO_ICON}" alt="Yak-élec" width="38" height="38"><span>${esc(Cf().brand.name1)}<b>${esc(Cf().brand.name2)}</b></span></a><button class="ctab${app.screen === 'contact' ? ' on' : ''}" data-go="contact" title="Me contacter">✉ Contact</button></div>
      <nav>${[['home', 'Accueil'], ['projects', 'Mes projets'], ['library', 'Bibliothèque'], ['editor', 'Atelier'], ['bat', 'Bâtiment'], ['quant', 'Quantitatif'], ['compo', 'Composants'], ['pv', 'Photovoltaïque']].concat(showPortal(u) ? [['portal', 'Portail']] : []).concat([['settings', 'Paramètres']]).map(([k, l]) => `<button class="nav${app.screen === k ? ' on' : ''}" data-go="${k}">${l}</button>`).join('')}</nav>
      <div class="user"><span title="Utilisateur connecté">👤 ${esc(u.name)}</span><button class="btn small" id="logout">Déconnexion</button></div></header>
      <main id="main"></main>`;
    $('#logout').onclick = () => { flushSave(); leaveEditor(); St.Users.logout(); EE.portalUnlocked = false; app.project = null; app.screen = 'home'; shell(); };
    $$('[data-go]').forEach((b) => (b.onclick = () => go(b.dataset.go)));
  }
  function leaveEditor() { flushSave(); if (app.editor) { app.editor.destroy(); app.editor = null; } }
  function go(screen, arg) {
    if (app.screen === 'editor' && screen !== 'editor') leaveEditor();
    app.screen = screen; shell(); if (!St.Users.current()) return;
    (Object.assign({ home: renderHome, projects: renderProjects, library: renderLibrary, editor: () => renderEditor(arg), settings: renderSettings }, EE.Screens || {}))[screen](arg);
  }
  app.go = go;

  // ---------- connexion ----------
  function renderLogin() {
    const users = St.Users.list(); const reg = !users.length;
    $('#app').innerHTML = `<div class="login"><div class="card login-card"><img class="logoimg full" src="${EE.LOGO_FULL}" alt="Yak-élec – Installation &amp; dépannage électrique"><h1 class="sr">${esc(Cf().brand.name1 + Cf().brand.name2)}</h1><p class="muted">${esc(Cf().brand.slogan)}</p><p class="small loginct">${EE.Contact ? EE.Contact.inline() : ''}</p>
      <div class="tabs"><button class="tab${reg ? '' : ' on'}" data-t="in">Connexion</button><button class="tab${reg ? ' on' : ''}" data-t="up">Créer un compte</button></div>
      <form id="lf" autocomplete="off"><label>Nom d'utilisateur<input id="lu" required list="ul"></label><datalist id="ul">${users.map((u) => `<option value="${esc(u.name)}">`).join('')}</datalist>
        ${pwField('lp', 'Mot de passe')}${pwField('lp2', 'Confirmer le mot de passe', ` id="l2" class="${reg ? '' : 'hide'}"`)}
        <p class="err" id="lerr"></p><button class="btn primary big" id="lgo">${reg ? 'Créer mon compte' : 'Se connecter'}</button></form>
      <p class="muted small">Les comptes et projets sont enregistrés <b>sur cet appareil</b> (navigateur). Pensez à exporter vos projets pour les sauvegarder ou les transférer.</p></div></div>`;
    bindEyes($('.login'));
    let up = reg;
    $$('.tab').forEach((b) => (b.onclick = () => { up = b.dataset.t === 'up'; $$('.tab').forEach((x) => x.classList.toggle('on', x === b)); $('#l2').classList.toggle('hide', !up); $('#lgo').textContent = up ? 'Créer mon compte' : 'Se connecter'; $('#lerr').textContent = ''; }));
    $('#lf').onsubmit = (e) => {
      e.preventDefault();
      try {
        if (up) { if ($('#lp').value !== $('#lp2').value) throw new Error('Les deux mots de passe ne correspondent pas.'); St.Users.register($('#lu').value, $('#lp').value); }
        else St.Users.login($('#lu').value, $('#lp').value);
        app.screen = 'home'; go('home');
      } catch (err) { $('#lerr').textContent = err.message; }
    };
  }

  // ---------- accueil ----------
  function renderHome() {
    const u = St.Users.current(), rec = St.Projects.recent(5), n = St.Projects.list().length;
    $('#main').innerHTML = `<div class="page"><section class="hero"><img class="logoimg hero-logo" src="${EE.LOGO_FULL}" alt="Yak-élec"><div><h1>${esc(Cf().brand.name1)}<b>${esc(Cf().brand.name2)}</b></h1><p>Bonjour ${esc(u.name)} – ${esc(Cf().brand.welcome)}</p><button class="btn small ctab2" data-go="contact">✉ Me contacter</button></div></section>
      ${St.raw.persistent ? '' : '<div class="warn">⚠ Le stockage du navigateur est indisponible : exportez vos projets, ils ne seront pas conservés.</div>'}
      <section class="cards">
        <button class="card act" data-a="new"><span class="ic">＋</span><b>Nouveau projet</b><small>Créer un schéma</small></button>
        <button class="card act" data-a="bat"><span class="ic">🏠</span><b>Électricité bâtiment</b><small>Unifilaire, multifilaire, architectural, développé</small></button>
        <button class="card act" data-a="projects"><span class="ic">📁</span><b>Mes projets</b><small>${n} projet${n > 1 ? 's' : ''}</small></button>
        <button class="card act" data-a="library"><span class="ic">🔣</span><b>Bibliothèque de symboles</b><small>${Lib.list.length} symboles</small></button>
        <button class="card act" data-a="editor"><span class="ic">✏️</span><b>Atelier de dessin</b><small>Ouvrir la feuille</small></button>
        <button class="card act" data-a="pv"><span class="ic">☀️</span><b>Photovoltaïque</b><small>Panneaux, batteries, onduleur</small></button>
        <button class="card act" data-a="quant"><span class="ic">🧮</span><b>Quantitatif et coffret</b><small>Matériel, protections, devis</small></button>
        ${showPortal(u) ? '<button class="card act" data-a="portal"><span class="ic">🛠️</span><b>Portail administrateur</b><small>Prix, règles, apparence</small></button>' : ''}
        <button class="card act" data-a="settings"><span class="ic">⚙️</span><b>Paramètres</b><small>Thème, grille, compte</small></button>
      </section>
      <section><h2>Derniers projets ouverts</h2>${rec.length ? `<div class="list">${rec.map((p) => `<button class="row" data-open="${p.id}"><b>${esc(p.name)}</b><span>${esc(EE.SCHEMAS[p.schema])} · ${esc(p.install)}</span><em>${EE.fmtDate(p.opened)}</em></button>`).join('')}</div>` : '<p class="muted">Aucun projet pour le moment. Créez votre premier schéma avec « Nouveau projet ».</p>'}</section></div>`;
    $$('[data-a]').forEach((b) => (b.onclick = () => ({ new: newProject, projects: () => go('projects'), library: () => go('library'), editor: () => go('editor'), settings: () => go('settings'), quant: () => go('quant'), bat: () => go('bat'), pv: () => go('pv'), portal: () => go('portal') })[b.dataset.a]()));
    $$('[data-open]').forEach((b) => (b.onclick = () => go('editor', b.dataset.open)));
  }
  async function newProject(schema) {
    const r = await projectDialog(null, typeof schema === 'string' ? schema : null); if (!r) return;
    try { const p = St.Projects.create(r); go('editor', p.id); } catch (e) { toast(e.message, 'bad'); }
  }
  app.newProject = newProject;

  // ---------- projets ----------
  function renderProjects(filter = '') {
    const l = St.Projects.list().slice().sort((a, b) => b.modified - a.modified).filter((p) => (p.name + p.install).toLowerCase().includes(filter.toLowerCase()));
    $('#main').innerHTML = `<div class="page"><div class="bar"><h1>Mes projets</h1><div class="grow"></div><input id="flt" placeholder="Rechercher…" value="${esc(filter)}"><button class="btn" id="imp">Importer…</button><button class="btn primary" id="np">＋ Nouveau projet</button><input type="file" id="impf" accept=".json,.eep,application/json" hidden></div>
      ${l.length ? `<div class="table"><div class="tr th"><span>Nom</span><span>Installation</span><span>Schéma</span><span>Modifié</span><span>Actions</span></div>${l.map((p) => `<div class="tr" data-id="${p.id}"><span><b>${esc(p.name)}</b></span><span>${esc(p.install)}</span><span>${esc(EE.SCHEMAS[p.schema])}</span><span>${EE.fmtDate(p.modified)}</span><span class="acts"><button class="btn small primary" data-a="open">Ouvrir</button><button class="btn small" data-a="edit">Modifier</button><button class="btn small" data-a="dup">Dupliquer</button><button class="btn small" data-a="exp">Exporter</button><button class="btn small danger" data-a="del">Supprimer</button></span></div>`).join('')}</div>` : '<p class="muted">Aucun projet.</p>'}</div>`;
    $('#np').onclick = newProject; $('#flt').oninput = (e) => { renderProjects(e.target.value); const i = $('#flt'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
    $('#imp').onclick = () => $('#impf').click();
    $('#impf').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { const p = St.Projects.importJSON(await f.text()); toast('Projet importé : ' + p.name, 'ok'); renderProjects(); } catch (err) { toast(err.message, 'bad'); } };
    $$('.tr[data-id] [data-a]').forEach((b) => (b.onclick = async () => {
      const id = b.closest('.tr').dataset.id, p = St.Projects.get(id);
      try {
        if (b.dataset.a === 'open') go('editor', id);
        else if (b.dataset.a === 'edit') { const r = await projectDialog(p); if (r) { St.Projects.edit(id, r); toast('Projet modifié', 'ok'); renderProjects($('#flt').value); } }
        else if (b.dataset.a === 'dup') { St.Projects.duplicate(id); toast('Projet dupliqué', 'ok'); renderProjects($('#flt').value); }
        else if (b.dataset.a === 'exp') EE.Export.run('json', p);
        else if (b.dataset.a === 'del') { if (await confirmBox('Supprimer le projet', `Supprimer définitivement « <b>${esc(p.name)}</b> » ? Cette action est irréversible.`, 'Supprimer')) { St.Projects.remove(id); toast('Projet supprimé', 'ok'); renderProjects($('#flt').value); } }
      } catch (err) { toast(err.message, 'bad'); }
    }));
  }

  // ---------- bibliothèque ----------
  function preview(d, mode, size = 90) {
    const c = { id: 'prev', type: d.id, x: 0, y: 0, rot: 0, label: '', val: d.defVal || '' };
    const [a, b, e, f] = d.bbox; const pad = 14;
    return `<svg viewBox="${a - pad} ${b - pad} ${e - a + 2 * pad} ${f - b + 2 * pad}" width="${size}" height="${size}" class="pv">${EE.Render.compMarkup(c, mode, {})}</svg>`;
  }
  function renderLibrary(cat = 'Tous', q = '', mode = 'developpe') {
    const list = Lib.list.filter((d) => (cat === 'Tous' || d.cat === cat) && (d.name + d.cat + d.desc).toLowerCase().includes(q.toLowerCase()));
    $('#main').innerHTML = `<div class="page"><div class="bar"><h1>Bibliothèque de symboles</h1><div class="grow"></div><input id="lq" placeholder="Rechercher un symbole…" value="${esc(q)}"><select id="lm">${schemaOpts(mode)}</select></div>
      <div class="chips">${['Tous', ...Lib.cats].map((c) => `<button class="chip${c === cat ? ' on' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="libgrid">${list.map((d) => `<button class="sym" data-s="${d.id}">${preview(d, mode)}<b>${esc(d.name)}</b><small>${esc(d.cat)}</small></button>`).join('') || '<p class="muted">Aucun symbole.</p>'}</div>
      <p class="muted small">Symboles redessinés de façon simplifiée d'après les principes de la norme NF EN 60617 (CEI 60617) ; ils ne reproduisent pas les planches de la norme. Pour un dossier officiel, vérifiez les symboles sur la norme en vigueur.</p></div>`;
    $$('.chip').forEach((b) => (b.onclick = () => renderLibrary(b.dataset.c, $('#lq').value, $('#lm').value)));
    $('#lq').oninput = () => { renderLibrary(cat, $('#lq').value, $('#lm').value); const i = $('#lq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
    $('#lm').onchange = () => renderLibrary(cat, $('#lq').value, $('#lm').value);
    $$('.sym').forEach((b) => (b.onclick = () => symbolSheet(b.dataset.s)));
  }
  async function symbolSheet(id) {
    const d = Lib.get(id);
    const body = `<div class="fiche"><div class="prevs">${Object.entries(EE.SCHEMAS).map(([k, v]) => `<figure>${preview(d, k, 110)}<figcaption>${v}</figcaption></figure>`).join('')}</div>
      <p>${esc(d.desc)}</p><p><b>À savoir :</b> ${esc(d.notes)}</p><p><b>Catégorie :</b> ${esc(d.cat)}${d.prefix ? ' · <b>Repère usuel :</b> ' + esc(d.prefix) : ''}</p>
