<title>Yak-élec-pro</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#17212b;--muted:#617080;--line:#d5dde6;--brand:#0b3d6b;--accent:#1769d1;--acc2:#ffc83d;--ok:#1b8a3a;--bad:#c62828;--warn:#b26a00;--sheet:#fff;--dot:#9fb0c3}
:root[data-theme=dark]{--bg:#10171f;--panel:#18222d;--ink:#e6edf4;--muted:#9bacbd;--line:#2b3a4a;--brand:#0b3d6b;--accent:#5aa2ff;--sheet:#0f1620;--dot:#40546a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem}h3{font-size:1.05rem;margin:.2em 0 .4em}h4{margin:.8em 0 .3em;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.85rem}.hide{display:none!important}.grow{flex:1}.center{text-align:center}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0}label input,label select{display:block;width:100%;margin-top:4px;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);margin:8px 0}.chk input{width:auto;min-height:0;margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.small{padding:4px 9px;min-height:32px;font-size:.85rem}.btn.big{padding:12px 20px;font-size:1.05rem;width:100%}
.btn.tool.on{background:var(--acc2);border-color:var(--acc2);color:#222}
.err{color:var(--bad);min-height:1.2em;margin:4px 0}
/* en-tête */
.top{display:flex;align-items:center;gap:14px;background:var(--brand);color:#fff;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem;cursor:pointer}.brand b{color:var(--acc2)}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}.nav{background:transparent;border:0;color:#cfe0f3;padding:8px 12px;border-radius:8px;cursor:pointer}.nav.on,.nav:hover{background:rgba(255,255,255,.15);color:#fff}
.user{display:flex;align-items:center;gap:10px;font-size:.9rem}.user .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#main{flex:1;min-height:0;overflow:auto}
.page{max-width:1100px;margin:0 auto;padding:20px 16px 40px}.page.narrow{max-width:640px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 18px}.hero h1{font-size:2rem}.hero b{color:var(--accent)}.hero p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.act{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px}.card.act:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(23,105,209,.15)}
.card .ic{font-size:1.6rem}.card small{color:var(--muted)}.card.flat{margin-bottom:14px}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:6px}.row{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;cursor:pointer}.row span{color:var(--muted);flex:1}.row em{color:var(--muted);font-style:normal;font-size:.85rem}
.table{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.tr{display:grid;grid-template-columns:2fr 1.2fr 1.3fr 1.1fr 3fr;gap:10px;padding:10px 14px;align-items:center;border-top:1px solid var(--line)}.tr.th{background:var(--bg);font-weight:600;color:var(--muted);border-top:0}.acts{display:flex;gap:6px;flex-wrap:wrap}
.login{min-height:100%;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#0b3d6b,#1769d1)}.login-card{width:min(420px,100%);text-align:center}.login-card form{text-align:left}.login-card h1 b{color:var(--accent)}
.tabs{display:flex;gap:4px;margin:12px 0}.tab{flex:1;background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px;cursor:pointer;color:var(--muted)}.tab.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sym{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}.sym:hover{border-color:var(--accent)}.sym small{color:var(--muted)}
.pv{color:var(--ink)}.fiche .prevs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.fiche figure{margin:0;text-align:center;font-size:.8rem;color:var(--muted)}
table.mini{border-collapse:collapse;width:100%;font-size:.88rem}table.mini td,table.mini th{border:1px solid var(--line);padding:4px 8px;text-align:left}
/* fenêtres */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:grid;place-items:center;padding:14px;z-index:50}.modal{background:var(--panel);border-radius:14px;padding:18px 20px;width:min(460px,100%);max-height:92vh;overflow:auto}.modal.wide{width:min(640px,100%)}.modal h2{margin:0 0 8px}.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toasts{position:fixed;right:14px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:60}.toast{background:#223;color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3)}.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
/* atelier */
.ed{height:100%;display:flex;flex-direction:column}
.tb{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tgrp{display:flex;gap:4px;align-items:center}.tb .btn{padding:4px 9px;min-height:34px;font-size:.88rem}.tb select{min-height:34px;padding:4px 8px}.pname{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.mobbtn{display:none}
.eb{flex:1;display:flex;min-height:0;position:relative}
.pal{width:210px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px}.pal input{width:100%;margin-bottom:4px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;cursor:pointer;text-align:left;font-size:.86rem}.pitem:hover{background:var(--bg)}.pitem.on{border-color:var(--accent);background:rgba(23,105,209,.12)}.pitem svg{flex:none;color:var(--ink)}
.sheetwrap{flex:1;min-width:0;background:var(--sheet);position:relative}
#sheet{width:100%;height:100%;display:block;touch-action:none;outline:none;color:var(--ink);user-select:none;-webkit-user-select:none}
#sheet[data-tool=wire],#sheet[data-tool=place]{cursor:crosshair}#sheet[data-tool=select]{cursor:default}
.gdot{fill:var(--dot)}.selbox{fill:rgba(23,105,209,.08);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}.selwire{fill:none;stroke:var(--accent);stroke-width:7;opacity:.3;stroke-linejoin:round}
.prevwire{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}.tfree{fill:rgba(255,160,0,.18);stroke:#f59e0b;stroke-width:2}.tok{fill:#27ae60}
.mk circle{fill:rgba(198,40,40,.15);stroke:#c62828;stroke-width:2.5}.mk.warning circle{fill:rgba(255,160,0,.18);stroke:#f59e0b}.mk text{fill:var(--ink);font:700 11px Arial;stroke:none}
.side{width:300px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px}.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.bt-list{margin-top:10px}.bt-list .row{padding:7px 12px}
.top nav{gap:2px}.nav{padding:8px 9px;font-size:.93rem;white-space:nowrap}
@media(min-width:1500px){.nav{padding:8px 12px;font-size:1rem}}
/* contrôle à distance */
#yk-lock{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:16px;background:radial-gradient(700px 400px at 20% 10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(160deg,#0b2a4a,#101820)}
.yk-card{width:min(480px,100%);background:var(--panel);color:var(--ink);border-radius:20px;padding:26px 24px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.55),0 6px 0 rgba(0,0,0,.2)}
.yk-card h1{margin:.3em 0}.yk-card p{margin:.6em 0}.yk-upd{background:color-mix(in srgb,var(--acc2) 22%,var(--panel));border-radius:12px;padding:10px 12px}.yk-id{color:var(--muted);font-size:.85rem}.yk-card .btnrow{justify-content:center}
#yk-upd{position:fixed;left:14px;bottom:44px;z-index:90;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:min(560px,calc(100% - 28px));background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
@media print{#yk-upd{display:none}}

/* rapport d'erreurs détaillé */
.issues li>div{display:flex;flex-direction:column;gap:3px}.ititle{font-size:.95rem}.imsg,.ifix{font-size:.84rem;line-height:1.35}.imsg u,.ifix u{text-decoration:none;font-weight:700;opacity:.85}
.ifix{background:rgba(46,160,67,.12);border-left:3px solid #2ea043;padding:4px 7px;border-radius:4px}.issues li.warning .ifix{background:rgba(240,160,30,.14);border-left-color:#e0a020}
.issues li small{opacity:.7}

/* page de dessin ajustable */
.zgrp{align-items:center;gap:4px}.zgrp input[type=range]{width:110px;accent-color:var(--accent,#2f6fed)}#b-z100{min-width:62px}
.split{width:6px;cursor:col-resize;background:transparent;flex:none;position:relative;z-index:2;touch-action:none}.split:hover,.split:active{background:rgba(47,111,237,.35)}.split::after{content:"";position:absolute;left:2px;top:calc(50% - 18px);height:36px;width:2px;border-radius:2px;background:var(--line)}
body.yk-full .top,body.yk-full .pal,body.yk-full .side,body.yk-full .split,body.yk-full .sb{display:none!important}
body.yk-full #b-full{background:#c62828;border-color:#c62828;color:#fff}
@media(max-width:900px){.split{display:none}.zgrp input[type=range]{width:80px}}
.fixbtn{margin-top:4px;align-self:flex-start;text-align:left;white-space:normal;height:auto;line-height:1.25;padding:5px 9px}#fixall{width:100%;margin:6px 0 4px}.rep ul{margin:4px 0 0 16px;padding:0}
#fixall{white-space:normal;height:auto;line-height:1.25;padding:8px 10px;text-align:center}

#mkpop{position:absolute;z-index:8;width:min(310px,88%);background:var(--panel);color:var(--ink);border:2px solid #c62828;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:10px 12px;font-size:.86rem}
#mkpop.warning{border-color:#f59e0b}#mkpop p{margin:5px 0}#mkpop .mkfix{background:rgba(46,160,67,.12);border-left:3px solid #2ea043;padding:4px 7px;border-radius:4px}#mkpop u{text-decoration:none;font-weight:700}
#mkpop .mkx{position:absolute;right:6px;top:4px;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--muted)}#mkpop .mkb{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#mkpop .mkb .btn{white-space:normal;height:auto;line-height:1.25;padding:7px 10px;text-align:left}#mkpop .mkb .btn small{display:block;font-weight:400;opacity:.85}

</style>

<script>
/* Yak-élec-pro – noyau : utilitaires, hachage, événements */
(function (g) {
  'use strict';
  const EE = g.EE = g.EE || {};
  EE.VERSION = '1.9.4';
  EE.G = 20; // pas de grille (px)
  EE.uid = (p = 'id') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  EE.clone = (o) => JSON.parse(JSON.stringify(o));
  EE.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  EE.snap = (v) => Math.round(v / EE.G) * EE.G;
  EE.pad2 = (n) => String(n).padStart(2, '0');
  EE.fmtDate = (t) => { const d = new Date(t); return EE.pad2(d.getDate()) + '/' + EE.pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + EE.pad2(d.getHours()) + ':' + EE.pad2(d.getMinutes()); };
  EE.fmtTime = (t) => { const d = new Date(t); return EE.pad2(d.getHours()) + ':' + EE.pad2(d.getMinutes()) + ':' + EE.pad2(d.getSeconds()); };

  // SHA-256 (synchrone, indépendant du contexte sécurisé du navigateur)
  EE.sha256 = function (str) {
    const bytes = Array.from(new TextEncoder().encode(str));
    const K = [], H = [];
    const isPrime = (n) => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
    for (let c = 2, n = 0; n < 64; c++) if (isPrime(c)) { if (n < 8) H[n] = Math.floor((Math.sqrt(c) % 1) * 4294967296) >>> 0; K[n++] = Math.floor((Math.cbrt(c) % 1) * 4294967296) >>> 0; }
    const l = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (l >>> (i * 8)) & 255);
    const rr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < bytes.length; o += 64) {
      const w = [];
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + 4 * i] << 24) | (bytes[o + 4 * i + 1] << 16) | (bytes[o + 4 * i + 2] << 8) | bytes[o + 4 * i + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, gg, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & gg);
        const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        h = gg; gg = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + gg) | 0; H[7] = (H[7] + h) | 0;
    }
    return H.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  };

  // Petit bus d'événements
  EE.Bus = { _h: {}, on(n, f) { (this._h[n] = this._h[n] || []).push(f); }, emit(n, d) { (this._h[n] || []).forEach((f) => f(d)); } };
})(window);

</script>

  ];

  EE.Draw = { L, C, R, P, T, DASH, t, swBody, REF, REF_I };
  const byId = {};
  defs.forEach((d) => { d.params = d.params || {}; byId[d.id] = d; });

  EE.Library = {
    list: defs,
    get: (id) => byId[id],
    cats: ['Liaisons', 'Sources', 'Commande', 'Protection', 'Récepteurs', 'Composants'],
    add(arr, cat) { arr.forEach((d) => { d.params = d.params || {}; byId[d.id] = d; defs.push(d); }); },
    // Bornes en coordonnées monde
    rot(x, y, rot) { const r = ((rot % 360) + 360) % 360; if (r === 90) return [-y, x]; if (r === 180) return [-x, -y]; if (r === 270) return [y, -x]; return [x, y]; },
    termWorld(c, tm) { const [rx, ry] = this.rot(tm.x, tm.y, c.rot || 0); return { x: Math.round(c.x + rx), y: Math.round(c.y + ry) }; },
    sources(c) { const d = byId[c.type]; if (d.srcFn) return d.srcFn(c); return d.src || null; },
    newComp(type, x, y) {
      const d = byId[type];
      return { id: EE.uid('c'), type, x, y, rot: 0, label: '', val: d.defVal || '' };
    },
    // Boîte englobante en coordonnées monde (avec rotation)
    bbox(c) {
      const d = byId[c.type]; const [a, b, e, f] = d.bbox;
      const pts = [[a, b], [e, b], [e, f], [a, f]].map(([x, y]) => this.rot(x, y, c.rot || 0));
      const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      return { x1: c.x + Math.min(...xs), y1: c.y + Math.min(...ys), x2: c.x + Math.max(...xs), y2: c.y + Math.max(...ys) };
    },
  };

    base('p_va_vient', 'Interrupteur va-et-vient', [-12, -14, 14, 12], 'Commande un point lumineux depuis deux endroits (utilisé par paire).', 'Prévoir deux va-et-vient par circuit.', () => C(0, 0, 5, true) + L(0, 0, 11, -11) + L(7, -7, 12, -2)),
    base('p_bp', 'Bouton poussoir', [-12, -12, 12, 12], 'Bouton poussoir (télérupteur, minuterie, sonnerie).', '', () => C(0, 0, 8) + T(0, 4, 'P', 11)),
    base('p_prise', 'Prise de courant 16 A 2P+T', [-12, -12, 12, 12], 'Prise de courant 2P+T 16 A.', 'Repérer le circuit prises dans « Identification ».', () => C(0, 0, 8) + L(-12, 0, 12, 0) + L(0, 0, 0, -8)),
    base('p_prise20', 'Prise de courant 20 A', [-12, -12, 12, 12], 'Prise 2P+T 20 A (circuit dédié).', '', () => C(0, 0, 8) + L(-12, 0, 12, 0) + L(0, 0, 0, -8) + T(0, 22, '20 A', 8)),
    base('p_prise_sp', 'Prise spécialisée', [-14, -14, 14, 14], 'Prise d\'un circuit spécialisé (lave-linge, lave-vaisselle, four, plaque…).', 'Précisez l\'appareil dans « Valeur ».', () => R(-10, -10, 20, 20) + C(0, 0, 5) + L(-5, 0, 5, 0), { params: { val: true }, defVal: 'LL' }),
    base('p_rj45', 'Prise de communication (RJ45)', [-12, -12, 12, 12], 'Prise de communication (téléphone, informatique).', '', () => P('M-10,-8 L10,-8 L0,8 Z') + T(0, -11, 'RJ', 8)),
    base('p_tv', 'Prise TV', [-12, -12, 12, 12], 'Prise de télévision (antenne / réseau).', '', () => C(0, 0, 9) + T(0, 3, 'TV', 8)),
    base('p_tableau', 'Tableau de répartition', [-24, -16, 24, 16], 'Tableau de répartition (coffret) : voir le menu Quantitatif pour sa composition.', 'Placé dans la gaine technique du logement (GTL) ou près de l\'entrée.', () => R(-20, -12, 40, 24) + T(0, 4, 'TD', 12)),
    base('p_compteur', 'Compteur / disjoncteur de branchement', [-16, -16, 16, 16], 'Compteur et disjoncteur de branchement (limite de propriété ou GTL).', '', () => R(-12, -12, 24, 24) + T(0, 4, 'kWh', 8)),
    base('p_daaf', 'Détecteur de fumée (DAAF)', [-12, -12, 12, 12], 'Détecteur avertisseur autonome de fumée (obligatoire dans les logements).', '', () => C(0, 0, 9) + T(0, 4, 'D', 11)),
    base('p_convecteur', 'Convecteur / radiateur électrique', [-24, -10, 24, 10], 'Appareil de chauffage électrique.', 'Circuit chauffage dédié (calibre à vérifier selon la puissance).', () => R(-20, -7, 40, 14) + P('M-14,0 L-10,-4 L-6,4 L-2,-4 L2,4 L6,-4 L10,4 L14,0')),
    base('p_chauffe_eau', 'Chauffe-eau', [-16, -16, 16, 16], 'Chauffe-eau électrique (circuit spécialisé).', '', () => C(0, 0, 13) + T(0, 4, 'CE', 10)),
    base('p_sonnerie', 'Sonnerie / sonnette', [-12, -12, 12, 12], 'Sonnerie ou sonnette d\'entrée.', '', () => P('M-8,6 L-8,-2 A8,8 0 0 1 8,-2 L8,6 Z') + L(-10, 6, 10, 6) + C(0, 9, 2, true)),
    base('p_vmc', 'VMC (ventilation)', [-14, -14, 14, 14], 'Ventilation mécanique contrôlée.', '', () => C(0, 0, 11) + T(0, 4, 'V', 12)),
    base('p_clim', 'Climatiseur', [-24, -10, 24, 10], 'Unité de climatisation (circuit dédié).', '', () => R(-20, -7, 40, 14) + T(0, 4, 'CL', 10)),
    base('p_derivation', 'Boîte de dérivation', [-10, -10, 10, 10], 'Boîte de dérivation : point de jonction des câbles.', 'Toujours accessible.', () => R(-8, -8, 16, 16) + L(-8, -8, 8, 8) + L(-8, 8, 8, -8)),
  ];
  defs.forEach((d) => { d.params = d.params || {}; });
  EE.Library.cats.push(CAT);
  EE.Library.add(defs);
})(window);

</script>
<script>
/* Yak-élec-pro – moteur de connectivité et vérification
   Principe : un croisement graphique n'est JAMAIS une connexion.
   Deux éléments sont reliés seulement si :
     - une extrémité de conducteur est sur une borne ;
     - deux extrémités de conducteurs coïncident ;
     - deux bornes coïncident ;
     - une « Connexion » (jonction) est placée sur le point (y compris sur un conducteur qui passe). */
(function (g) {
  'use strict';
  const EE = g.EE, Lib = EE.Library;
  const key = (x, y) => x + ',' + y;

  function onSegment(p, a, b) { // p sur le segment [a,b] (segments orthogonaux ou obliques)
    const cross = (p.y - a.y) * (b.x - a.x) - (p.x - a.x) * (b.y - a.y);
    if (Math.abs(cross) > 1e-6) return false;
    return p.x >= Math.min(a.x, b.x) - 1e-6 && p.x <= Math.max(a.x, b.x) + 1e-6 && p.y >= Math.min(a.y, b.y) - 1e-6 && p.y <= Math.max(a.y, b.y) + 1e-6;
  }
  const wpts = (w) => w.pts.map((p) => ({ x: p[0], y: p[1] }));
  function onWire(p, w, interiorOnly) {
    const ps = wpts(w);
    if (interiorOnly) { const e0 = ps[0], e1 = ps[ps.length - 1]; if ((p.x === e0.x && p.y === e0.y) || (p.x === e1.x && p.y === e1.y)) return false; }
    for (let i = 0; i < ps.length - 1; i++) if (onSegment(p, ps[i], ps[i + 1])) return true;
    return false;
  }

  class UF { constructor() { this.p = {}; } find(a) { if (!(a in this.p)) this.p[a] = a; while (this.p[a] !== a) { this.p[a] = this.p[this.p[a]]; a = this.p[a]; } return a; } union(a, b) { a = this.find(a); b = this.find(b); if (a !== b) this.p[a] = b; } }

  function analyze(doc) {
    const uf = new UF();
    const terms = []; // {k, cid, tid, x, y, comp, tm}
    const byCoord = {};
    const comps = {};
    doc.comps.forEach((c) => {
      comps[c.id] = c;
      const d = Lib.get(c.type); if (!d) return;
      d.term.forEach((tm) => {
        const p = Lib.termWorld(c, tm);
        const T = { k: 'T:' + c.id + '.' + tm.id, cid: c.id, tid: tm.id, x: p.x, y: p.y, comp: c, tm };
        terms.push(T); (byCoord[key(p.x, p.y)] = byCoord[key(p.x, p.y)] || []).push(T); uf.find(T.k);
      });
    });
    const ambiguous = [];
    // 1. bornes qui coïncident (contact direct)
    Object.values(byCoord).forEach((l) => { for (let i = 1; i < l.length; i++) uf.union(l[0].k, l[i].k); });
    // 2. conducteurs
    const epIndex = {};
    doc.wires.forEach((w) => {
      const wk = 'W:' + w.id; uf.find(wk);
      const ps = wpts(w); if (ps.length < 2) return;
      [ps[0], ps[ps.length - 1]].forEach((p, i) => {
        const kk = key(p.x, p.y);
        (byCoord[kk] || []).forEach((T) => uf.union(wk, T.k));
        (epIndex[kk] = epIndex[kk] || []).push({ w, end: i });
      });
    });
    Object.values(epIndex).forEach((l) => { for (let i = 1; i < l.length; i++) uf.union('W:' + l[0].w.id, 'W:' + l[i].w.id); });
    // 3. jonctions : relient les conducteurs qui passent par le point
    const junctions = doc.comps.filter((c) => c.type === 'connexion');
    junctions.forEach((j) => {
      doc.wires.forEach((w) => { if (w.pts.length > 1 && onWire({ x: j.x, y: j.y }, w, false)) uf.union('W:' + w.id, 'T:' + j.id + '.J'); });
    });
    // 4. contacts ambigus : extrémité ou borne posée sur un conducteur qui passe, sans jonction
    doc.wires.forEach((w) => {
      const ps = wpts(w); if (ps.length < 2) return;
      doc.wires.forEach((o) => {
        if (o === w || o.pts.length < 2) return;
        [ps[0], ps[ps.length - 1]].forEach((p) => {
          if (onWire(p, o, true) && !(byCoord[key(p.x, p.y)] || []).some((T) => T.comp.type === 'connexion')) ambiguous.push({ x: p.x, y: p.y, wid: w.id, other: o.id, kind: 'end' });
        });
      });
      terms.forEach((T) => {
        if (T.comp.type === 'connexion') return;
        if (onWire({ x: T.x, y: T.y }, w, true) && uf.find(T.k) !== uf.find('W:' + w.id)) ambiguous.push({ x: T.x, y: T.y, wid: w.id, cid: T.cid, tid: T.tid, kind: 'term' });
      });
    });
    // 5. réseaux (nets)
    const nets = {};
    const netOf = (k) => uf.find(k);
    terms.forEach((T) => { const n = netOf(T.k); (nets[n] = nets[n] || { id: n, terms: [], wires: [], pots: new Set() }).terms.push(T); });
    doc.wires.forEach((w) => { const n = netOf('W:' + w.id); (nets[n] = nets[n] || { id: n, terms: [], wires: [], pots: new Set() }).wires.push(w); });
    // 6. sources de potentiel
    terms.forEach((T) => {
      const s = Lib.sources(T.comp); if (s && s[T.tid]) nets[netOf(T.k)].pots.add(s[T.tid]);
    });
    const A = { uf, terms, comps, nets, netOf, byCoord, ambiguous, junctions };
    // 7. arêtes internes (appareils)
    A.edges = { sw: [], pa: [] };
    doc.comps.forEach((c) => {
      const d = Lib.get(c.type); if (!d) return;
      ['sw', 'pa'].forEach((kind) => (d[kind] || []).forEach(([a, b]) => A.edges[kind].push([netOf('T:' + c.id + '.' + a), netOf('T:' + c.id + '.' + b), c.id])));
    });
    return A;
  }

  // BFS sur le graphe des réseaux à travers les arêtes autorisées ; retourne l'ensemble des potentiels atteints
  function reach(A, startNet, kinds) {
    const adj = {};
    kinds.forEach((k) => A.edges[k].forEach(([a, b]) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); }));
    const seen = new Set([startNet]), q = [startNet], pots = new Set(), nets = [];
    while (q.length) { const n = q.shift(); nets.push(n); if (A.nets[n]) A.nets[n].pots.forEach((p) => pots.add(p)); (adj[n] || []).forEach((m) => { if (!seen.has(m)) { seen.add(m); q.push(m); } }); }
    return { pots, nets };
  }

  // Affectation de potentiels deux à deux distincts à chaque borne d'alimentation
  function canAssign(sets) {
    const rec = (i, used) => { if (i === sets.length) return true; for (const p of sets[i]) if (!used.has(p)) { used.add(p); if (rec(i + 1, used)) return true; used.delete(p); } return false; };
    return rec(0, new Set());
  }

  // titre clair + « comment corriger » pour chaque type d'anomalie
  const HELP = {
    NO_ID: ['Composant sans repère', 'Cliquez sur le composant, puis écrivez son repère dans le champ « Repère » du panneau Propriétés (ex. Q1 pour un disjoncteur, H1 pour une lampe, KM1 pour un contacteur).'],
    DUP_ID: ['Deux composants ont le même repère', 'Donnez à chacun un repère différent (ex. H1 et H2). Seuls une bobine et ses contacts peuvent porter le même repère.'],
    CONTACT_NO_COIL: ['Contact sans bobine', 'Donnez au contact le même repère que sa bobine ou son contacteur (ex. KM1), ou ajoutez la bobine qui le commande.'],
    ISOLATED: ['Conducteur isolé', 'Ce conducteur ne touche aucune borne. Sélectionnez-le puis appuyez sur Suppr, ou prolongez-le jusqu\'à la borne d\'un composant.'],
    WIRE_SHORT: ['Conducteur incomplet', 'Supprimez ce conducteur puis retracez-le : cliquez sur la borne de départ, puis sur la borne d\'arrivée.'],
    DANGLING: ['Fil non raccordé', 'Tirez cette extrémité jusqu\'à une borne (petit point) d\'un composant ou jusqu\'à un autre conducteur, ou supprimez le fil s\'il est inutile.'],
    AMBIGUOUS: ['Connexion ambiguë', 'Si les deux conducteurs doivent être reliés, ajoutez le symbole « Connexion » (gros point) à cet endroit. Sinon, écartez-les ou utilisez « Croisement sans connexion ».'],
    JUNC_ALONE: ['Jonction inutile', 'Reliez cette jonction à un conducteur, ou supprimez-la.'],
    PE_OPEN: ['Borne de terre non raccordée', 'Reliez cette borne de terre (PE) au symbole « Terre » avec un conducteur : c\'est obligatoire pour la sécurité des personnes (NF C 15-100).'],
    SRC_OPEN: ['Source non raccordée', 'Tracez un conducteur depuis la borne de cette source (phase, neutre ou terre) vers le circuit à alimenter.'],
    TERM_OPEN: ['Borne non raccordée', 'Tracez un conducteur depuis cette borne vers le composant suivant. Si la borne ne sert pas (contact auxiliaire inutilisé), vous pouvez l\'ignorer.'],
    SHORT: ['Court-circuit', 'La phase et le neutre (ou deux phases) sont reliés sans récepteur entre eux. Insérez un récepteur (lampe, moteur, résistance…) entre les deux, ou supprimez le conducteur qui les relie directement.'],
    OPEN: ['Circuit ouvert (récepteur non alimenté)', 'Une borne du récepteur n\'est reliée à aucune source. Reliez une borne à la phase (en passant par l\'interrupteur et le disjoncteur) et l\'autre borne au neutre.'],
    SAME_POT: ['Récepteur mal branché', 'Les deux bornes du récepteur sont au même potentiel (par exemple les deux sur la phase). Reliez une borne à la phase et l\'autre au neutre (ou à une autre phase).'],
    PE_NOTEARTH: ['Masse non reliée à la terre', 'Reliez la borne de terre (PE) de ce composant au symbole « Terre » : la masse métallique doit toujours être protégée.'],
    NO_SOURCE: ['Aucune source dans le schéma', 'Ajoutez les symboles « Phase » et « Neutre » (catégorie Sources) et reliez-les au circuit, pour que le logiciel puisse contrôler l\'alimentation.'],
  };

  function verify(doc) {
    const A = analyze(doc), issues = [];
    let n = 0;
    const add = (sev, code, msg, x, y, ref) => issues.push({ id: ++n, sev, code, msg, x, y, ref: ref || null, title: (HELP[code] || [''])[0], fix: (HELP[code] || ['', ''])[1] });
    const compName = (c) => (c.label ? c.label : Lib.get(c.type).name) + (c.label ? ' (' + Lib.get(c.type).name + ')' : '');
    const nonEmpty = doc.comps.filter((c) => c.type !== 'conducteur');
    if (!nonEmpty.length && !doc.wires.length) return { issues, ok: true, stats: stats(), empty: true, A };

    // --- Identification des composants
    const needLabel = (c) => !['connexion', 'croisement', 'terre', 'phase', 'neutre'].includes(c.type);
    const seenLabels = {};
    doc.comps.forEach((c) => {
      if (!needLabel(c)) return;
      if (!c.label || !c.label.trim()) add('warning', 'NO_ID', `Composant sans identification : ${Lib.get(c.type).name}.`, c.x, c.y, { cid: c.id });
      else { const l = c.label.trim().toLowerCase(); (seenLabels[l] = seenLabels[l] || []).push(c); }
    });
    // les contacts (KM1…) partagent volontairement le repère de leur bobine
    Object.values(seenLabels).forEach((l) => { const prim = l.filter((c) => !Lib.get(c.type).contact); if (prim.length > 1) prim.forEach((c) => add('warning', 'DUP_ID', `Identification en double : « ${c.label} » (${prim.length} composants).`, c.x, c.y, { cid: c.id })); });
    doc.comps.forEach((c) => { const d = Lib.get(c.type); if (d.contact && c.label && !doc.comps.some((x) => Lib.get(x.type).coil && x.label === c.label)) add('warning', 'CONTACT_NO_COIL', `Contact « ${c.label} » : aucune bobine ou aucun contacteur portant le même repère.`, c.x, c.y, { cid: c.id }); });

    // --- Fils non raccordés / conducteurs isolés
    const isolatedWires = new Set();
    Object.values(A.nets).forEach((net) => {
      if (net.wires.length && !net.terms.length) {
        const w = net.wires[0]; net.wires.forEach((x) => isolatedWires.add(x.id));
        add('error', 'ISOLATED', `Conducteur isolé : ce conducteur n'est relié à aucune borne${net.wires.length > 1 ? ' (groupe de ' + net.wires.length + ' conducteurs)' : ''}.`, w.pts[0][0], w.pts[0][1], { wid: w.id });
      }
    });
    doc.wires.forEach((w) => {
      if (isolatedWires.has(w.id)) return;
      const ps = wpts(w);
      if (ps.length < 2) { add('error', 'WIRE_SHORT', 'Conducteur incomplet (moins de deux points).', ps[0] ? ps[0].x : 0, ps[0] ? ps[0].y : 0, { wid: w.id }); return; }
      [ps[0], ps[ps.length - 1]].forEach((p) => {
        const kk = key(p.x, p.y);
        const hasTerm = (A.byCoord[kk] || []).length > 0;
        const otherEnd = doc.wires.some((o) => o !== w && o.pts.length > 1 && ((o.pts[0][0] === p.x && o.pts[0][1] === p.y) || (o.pts[o.pts.length - 1][0] === p.x && o.pts[o.pts.length - 1][1] === p.y)));
        const touches = doc.wires.some((o) => o !== w && o.pts.length > 1 && onWire(p, o, true));
        if (!hasTerm && !otherEnd && !touches) add('error', 'DANGLING', 'Fil non raccordé : cette extrémité ne touche aucune borne ni aucun conducteur.', p.x, p.y, { wid: w.id });
      });
    });
    // --- Contacts ambigus (T sans jonction)
    const seenAmb = new Set();
    A.ambiguous.forEach((a) => {
      const kk = a.kind + key(a.x, a.y) + a.wid; if (seenAmb.has(kk)) return; seenAmb.add(kk);
      add('error', 'AMBIGUOUS', a.kind === 'end' ? 'Connexion ambiguë : un conducteur touche un autre conducteur sans « Connexion » (jonction). Ajouter une jonction, ou écarter le conducteur.' : 'Une borne est posée sur un conducteur qui passe sans y être reliée : ajouter une jonction ou déplacer le composant.', a.x, a.y, { wid: a.wid, cid: a.cid });
    });
    // --- Bornes sans connexion
    A.terms.forEach((T) => {
      const d = Lib.get(T.comp.type), net = A.nets[A.netOf(T.k)];
      const connected = net.wires.length > 0 || net.terms.length > 1;
      if (connected) return;
      if (T.comp.type === 'connexion') { add('warning', 'JUNC_ALONE', 'Jonction isolée (aucun conducteur).', T.x, T.y, { cid: T.cid }); return; }
      if (T.tm.opt) return;
      if (T.tm.pe) add('warning', 'PE_OPEN', `Borne de terre non raccordée : ${compName(T.comp)}, borne ${T.tid}.`, T.x, T.y, { cid: T.cid, tid: T.tid });
      else if (d.src || d.srcFn && ['phase', 'neutre', 'terre'].includes(T.comp.type)) add('error', 'SRC_OPEN', `Source non raccordée : ${compName(T.comp)}.`, T.x, T.y, { cid: T.cid });
      else add('error', 'TERM_OPEN', `Borne sans connexion : ${compName(T.comp)}, borne ${T.tid}.`, T.x, T.y, { cid: T.cid, tid: T.tid });
    });
    // --- Court-circuits : plusieurs potentiels reliés sans charge (conducteurs + organes de coupure seulement)
    const doneNets = new Set();
    Object.keys(A.nets).forEach((nid) => {
      if (doneNets.has(nid)) return;
      const r = reach(A, nid, ['sw']); r.nets.forEach((m) => doneNets.add(m));
      if (r.pots.size > 1) {
        const net = A.nets[nid]; const pt = net.terms[0] ? { x: net.terms[0].x, y: net.terms[0].y } : { x: net.wires[0].pts[0][0], y: net.wires[0].pts[0][1] };
        add('error', 'SHORT', `Court-circuit possible : ${[...r.pots].map((p) => p.replace(/^c[a-z0-9]+\./, 'secondaire ')).join(' et ')} sont reliés sans charge entre eux.`, pt.x, pt.y, net.terms[0] ? { cid: net.terms[0].cid } : { wid: net.wires[0].id });
      }
    });
    // --- Charges : alimentation, circuits ouverts, même potentiel
    const hasSource = Object.values(A.nets).some((n) => n.pots.size);
    let loadCount = 0;
    doc.comps.forEach((c) => {
      const d = Lib.get(c.type); if (!d || !d.loads) return;
      d.loads.forEach((supply) => {
        loadCount++;
        const sets = [], missing = [];
        supply.forEach((tid) => {
          const T = A.terms.find((x) => x.cid === c.id && x.tid === tid);
          const r = reach(A, A.netOf(T.k), ['sw', 'pa']);
          const pots = new Set([...r.pots].filter((p) => p !== 'PE'));
          sets.push(pots); if (!pots.size) missing.push(T);
        });
        if (!hasSource) return;
        const name = compName(c);
        if (missing.length) {
          const T0 = missing[0];
          add('error', 'OPEN', `Circuit ouvert : ${name} — la borne ${missing.map((m) => m.tid).join(', ')} n'est reliée à aucune source (phase, neutre ou secondaire) même en fermant les appareils de commande.`, T0.x, T0.y, { cid: c.id, tid: T0.tid });
        } else if (!canAssign(sets)) {
          add('error', 'SAME_POT', `Connexion incohérente : les bornes d'alimentation de ${name} sont au même potentiel (récepteur non alimenté ou court-circuité).`, c.x, c.y, { cid: c.id });
        }
      });
      // borne de terre : doit atteindre la terre
      d.term.filter((tm) => tm.pe).forEach((tm) => {
        const T = A.terms.find((x) => x.cid === c.id && x.tid === tm.id);
        const net = A.nets[A.netOf(T.k)];
        if (net.wires.length || net.terms.length > 1) {
          const r = reach(A, A.netOf(T.k), ['sw']);
          if (!r.pots.has('PE') && Object.values(A.nets).some((n) => n.pots.has('PE'))) add('warning', 'PE_NOTEARTH', `La borne de terre de ${compName(c)} n'est pas reliée à la terre.`, T.x, T.y, { cid: c.id, tid: tm.id });
        }
      });
    });
    if (!hasSource && loadCount) add('warning', 'NO_SOURCE', 'Aucune source (Phase / Neutre / transformateur) dans le schéma : impossible de contrôler l\'alimentation des récepteurs.', 0, 0, null);
    return { issues, ok: !issues.some((i) => i.sev === 'error'), stats: stats(), A };

      doc.comps.forEach((c) => { if (Lib.get(c.type).contact && !doc.comps.some((x) => Lib.get(x.type).coil && x.label === c.label && c.label)) { const m = `Contact « ${c.label || '?'} » sans bobine du même repère`; if (!alerts.includes(m)) alerts.push(m); } });
      if (S.shortRoots && S.shortRoots.size) alerts.push('Court-circuit présent sans protection : ajoutez un fusible ou un disjoncteur');
      const wire = {};
      doc.wires.forEach((w) => {
        const n = A.netOf('W:' + w.id); const pots = [...G.potsOfA(n)]; const sh = S.shortRoots && S.shortRoots.has(G.find(G.ufS, n));
        wire[w.id] = { pots, short: !!sh };
      });
      return { comp, wire, items, alerts, log: S.log.slice(-6) };
    }

    function tick(dt) {
      let changed = false; const before = JSON.stringify(S.view);

      const done = {}; doc.comps.forEach((c) => { const d = Lib.get(c.type); if (d.timer && c.label) done[c.label] = !!S.coil[c.label] && S.el[c.label] >= parseDelay(c.val) - 1e-9; });
      doc.comps.forEach((c) => { const dv = DEV[c.type]; if (dv && dv.tick && S.st[c.id]) dv.tick(S.st[c.id], dt, c); });

      changed = JSON.stringify(S.view) !== before; return changed;
    }
    function find(cid) { return byId[cid]; }

      doc, get view() { return S.view; }, state: S.st, coil: S.coil,

      isInteractive(cid) { const c = find(cid); return !!(c && DEV[c.type] && S.st[cid]); },
    };
  }

<script>
/* Yak-élec-pro – utilisateurs, projets, paramètres (stockage local du navigateur / de l'appareil) */
(function (g) {
  'use strict';
  const EE = g.EE;
  const mem = {};
  const S = {
    persistent: true,
    get(k, def) { try { const v = g.localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : def) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : def; } },
    set(k, v) { mem[k] = v; try { g.localStorage.setItem(k, JSON.stringify(v)); S.persistent = true; return true; } catch (e) { S.persistent = false; return false; } },
    del(k) { delete mem[k]; try { g.localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  EE.INSTALLS = ['Résidentiel', 'Tertiaire', 'Industriel', 'Enseignement / atelier', 'Autre'];
  EE.SCHEMAS = { developpe: 'Schéma développé', unifilaire: 'Schéma unifilaire', multifilaire: 'Schéma multifilaire', architectural: 'Schéma architectural (plan)' };

  const Users = {
    list() { return S.get('eep.users', []); },
    current() { const id = S.get('eep.session', null); return id ? Users.list().find((u) => u.id === id) || null : null; },
    hash(name, pwd, salt) { return EE.sha256(salt + '|' + name.toLowerCase() + '|' + pwd); },
    register(name, pwd) {
      name = (name || '').trim();
      if (name.length < 2) throw new Error('Le nom doit contenir au moins 2 caractères.');
      if ((pwd || '').length < 4) throw new Error('Le mot de passe doit contenir au moins 4 caractères.');
      if (EE.Config && EE.Config.isAdminName(name) && !EE.Config.checkAdminPassword(pwd)) throw new Error('Ce nom de compte est réservé à l\'administrateur : mot de passe administrateur requis.');
      const us = Users.list();
      if (us.some((u) => u.name.toLowerCase() === name.toLowerCase())) throw new Error('Ce nom d\'utilisateur existe déjà.');
      const salt = EE.uid('s'); const u = { id: EE.uid('u'), name, salt, hash: Users.hash(name, pwd, salt), created: Date.now() };
      us.push(u); S.set('eep.users', us); S.set('eep.session', u.id); return u;
    },
    login(name, pwd) {
      const u = Users.list().find((x) => x.name.toLowerCase() === (name || '').trim().toLowerCase());
      if (!u || u.hash !== Users.hash(u.name, pwd || '', u.salt)) throw new Error('Nom ou mot de passe incorrect.');
      S.set('eep.session', u.id); return u;
    },
    logout() { S.del('eep.session'); },
    changePassword(oldPwd, newPwd) {
      const u = Users.current(); if (!u) throw new Error('Aucun utilisateur connecté.');
      if (u.hash !== Users.hash(u.name, oldPwd || '', u.salt)) throw new Error('Ancien mot de passe incorrect.');
      if ((newPwd || '').length < 4) throw new Error('Le nouveau mot de passe doit contenir au moins 4 caractères.');
      const us = Users.list(); const x = us.find((a) => a.id === u.id); x.hash = Users.hash(u.name, newPwd, x.salt); S.set('eep.users', us);
    },
    remove(id) { S.set('eep.users', Users.list().filter((u) => u.id !== id)); S.del('eep.projects.' + id); S.del('eep.settings.' + id); if (S.get('eep.session') === id) S.del('eep.session'); },
  };

  const defaultSettings = { snap: true, grid: true, autolabel: true, theme: 'light', terminalMarks: true };
  const Settings = {
    get() { const u = Users.current(); return Object.assign({}, defaultSettings, u ? S.get('eep.settings.' + u.id, {}) : {}); },
    set(patch) { const u = Users.current(); if (!u) return; S.set('eep.settings.' + u.id, Object.assign(Settings.get(), patch)); },
  };

  const key = () => { const u = Users.current(); if (!u) throw new Error('Aucun utilisateur connecté.'); return 'eep.projects.' + u.id; };
  const Projects = {
    list() { return S.get(key(), []); },
    get(id) { return Projects.list().find((p) => p.id === id) || null; },
    _save(l) { const ok = S.set(key(), l); if (!ok) throw new Error('Stockage plein ou indisponible : exportez vos projets.'); },
    create({ name, install, schema }) {
      name = (name || '').trim(); if (!name) throw new Error('Le nom du projet est obligatoire.');
      const p = { id: EE.uid('p'), owner: Users.current().id, name, install: install || EE.INSTALLS[0], schema: schema || 'developpe', created: Date.now(), modified: Date.now(), opened: Date.now(), doc: { comps: [], wires: [] }, view: { x: 80, y: 80, k: 1 }, v: 1 };
      const l = Projects.list(); l.push(p); Projects._save(l); return p;
    },
    update(p) { const l = Projects.list(); const i = l.findIndex((x) => x.id === p.id); if (i < 0) throw new Error('Projet introuvable.'); p.modified = Date.now(); l[i] = p; Projects._save(l); return p; },
    touch(id) { const l = Projects.list(); const p = l.find((x) => x.id === id); if (p) { p.opened = Date.now(); Projects._save(l); } return p; },
    edit(id, { name, install, schema }) {
      name = (name || '').trim(); if (!name) throw new Error('Le nom du projet est obligatoire.');
      const l = Projects.list(); const p = l.find((x) => x.id === id); if (!p) throw new Error('Projet introuvable.');
      Object.assign(p, { name, install, schema, modified: Date.now() }); Projects._save(l); return p;
    },
    duplicate(id) {
      const l = Projects.list(); const p = l.find((x) => x.id === id); if (!p) throw new Error('Projet introuvable.');
      const c = EE.clone(p); c.id = EE.uid('p'); c.name = p.name + ' (copie)'; c.created = c.modified = c.opened = Date.now(); l.push(c); Projects._save(l); return c;
    },
    remove(id) { Projects._save(Projects.list().filter((p) => p.id !== id)); },
    recent(n = 5) { return Projects.list().slice().sort((a, b) => b.opened - a.opened).slice(0, n); },
    exportJSON(id) { const p = Projects.get(id); return JSON.stringify({ format: 'yak-elec-pro', version: 1, project: p }, null, 1); },
    importJSON(text) {
      let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Fichier illisible (JSON invalide).'); }
      if (!o || !['yak-elec-pro', 'elec-expert-pro'].includes(o.format) || !o.project || !o.project.doc || !Array.isArray(o.project.doc.comps) || !Array.isArray(o.project.doc.wires)) throw new Error('Ce fichier n\'est pas un projet Yak-élec-pro.');
      const p = o.project; p.id = EE.uid('p'); p.owner = Users.current().id; p.name = (p.name || 'Projet importé'); p.modified = p.opened = Date.now();
      const l = Projects.list(); l.push(p); Projects._save(l); return p;
    },
  };
  EE.Store = { raw: S, Users, Settings, Projects };
})(window);

    if (circuits.length && R.mainInCoffret) devs.push({ k: 'main', cid: 'general_' + mainA, label: 'DG', sub: mainA + ' A', mods: modsOf('general_' + mainA) });

      else if (k.startsWith('Arrow')) { e.preventDefault(); nudge(k === 'ArrowLeft' ? -G : k === 'ArrowRight' ? G : 0, k === 'ArrowUp' ? -G : k === 'ArrowDown' ? G : 0); }

    window.addEventListener('keydown', onKey);
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => render()) : null; ro && ro.observe(svg);

    const api = {
      get doc() { return doc; }, project, get tool() { return tool; }, get armed() { return armed; },
      render, setTool, arm, undo, redo, copy, paste, duplicate, del, rotate, selectAll, select, updateSelected,
      startSim() { if (simObj) return simObj; drawing = null; armed = null; tool = 'select'; sel = { c: new Set(), w: new Set() }; markers = []; notifySel();
        simObj = EE.Sim.create(doc); simObj.solve();
        simTimer = setInterval(() => { const ch = simObj.tick(0.1); opt.onSimTick && opt.onSimTick(simObj); if (ch) render(); }, 100);
        render(); opt.onSim && opt.onSim(true, simObj); return simObj; },
      stopSim() { if (!simObj) return; clearInterval(simTimer); simObj = null; simHold = null; render(); opt.onSim && opt.onSim(false, null); },

      setZoom: (k) => zoomAt(Math.max(0.2, Math.min(4, k)) / v.k), zoomIn: () => zoomAt(1.25), zoomOut: () => zoomAt(0.8), fit, centerOn, verify, focusIssue, clearMarkers,

      replaceDoc(d) { doc = EE.clone(d); project.doc = doc; hist = [JSON.stringify(doc)]; hi = 0; sel = { c: new Set(), w: new Set() }; markers = []; render(); },
      destroy() { clearInterval(simTimer); window.removeEventListener('keydown', onKey); ro && ro.disconnect(); svg.innerHTML = ''; },
