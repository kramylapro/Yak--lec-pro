name: Construire l'application Android (APK)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { gradle-version: '8.9' }
      - name: Adresse du contrôle à distance et fabrication de l'application web
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          export YAK_CONTROL_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/main/site/control.json"
          python3 build.py
          cp dist/yak-elec-pro.html android/app/src/main/assets/index.html
          python3 android/make_icons.py
      - name: Construire l'APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yak-elec-pro-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
